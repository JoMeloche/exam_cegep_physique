<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="ExamGen: générateur d'examens LaTeX / LaTeX exam generator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#grid)"/>

  <!-- logo -->
  <g transform="translate(96 92)">
    <rect width="136" height="136" rx="34" fill="#ffffff"/>
    <path d="M40 42h56M40 68h56M40 94h32" stroke="#4f46e5" stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- title -->
  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="276" y="152" font-size="64" font-weight="700" letter-spacing="-1.5">ExamGen</text>
    <text x="278" y="196" font-size="24" fill-opacity="0.92">Examens LaTeX automatiques pour le cégep</text>
    <text x="278" y="230" font-size="20" fill-opacity="0.7">Automatic LaTeX exams · versions · solutions · PDF</text>
  </g>

  <!-- floating exam cards -->
  <g transform="translate(850 58) rotate(-6)">
    <rect width="180" height="220" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.25"/>
    <rect x="22" y="26" width="110" height="10" rx="5" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="22" y="50" width="136" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="22" y="66" width="140" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.35"/>
    <text x="22" y="120" font-family="'Times New Roman', serif" font-style="italic" font-size="24" fill="#ffffff">ω² = k / m</text>
    <rect x="22" y="148" width="136" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="22" y="164" width="120" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="22" y="192" width="54" height="20" rx="10" fill="#34d399" fill-opacity="0.9"/>
    <text x="32" y="207" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#064e3b">v1</text>
  </g>
  <g transform="translate(1062 66) rotate(6)">
    <rect width="170" height="210" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.25"/>
    <rect x="20" y="24" width="96" height="10" rx="5" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="20" y="48" width="140" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="20" y="64" width="120" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.35"/>
    <text x="20" y="114" font-family="'Times New Roman', serif" font-style="italic" font-size="24" fill="#ffffff">λ = v / f</text>
    <rect x="20" y="140" width="140" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="20" y="174" width="54" height="20" rx="10" fill="#fbbf24" fill-opacity="0.95"/>
    <text x="30" y="189" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#78350f">v2</text>
  </g>
</svg>
