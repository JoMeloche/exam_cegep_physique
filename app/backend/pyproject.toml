[project]
name = "examgen"
version = "1.0.1"
description = "Exam generator: question library, versioned exams, solutions and PDF export"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "sympy>=1.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
desktop = ["pywebview>=5", "pyinstaller>=6"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
examgen = "examgen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["examgen*"]

[tool.setuptools.package-data]
examgen = ["templates/*", "static/**/*"]
