name: Build Linux app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/build-linux.yml"

permissions:
  contents: write  # attach the packages to the GitHub release on v* tags

jobs:
  linux:
    # Build on the oldest supported runner so the AppImage runs on older glibc too.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: System libraries (Qt WebEngine, AppImage, smoke test)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libnss3 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 \
            libxcb-image0 file xvfb

      - name: Build AppImage and .deb
        run: bash app/packaging/linux/build_linux.sh
        env:
          PYTHON: python

      - name: Smoke test (app starts, finds the bundled LaTeX, exports an exam)
        run: xvfb-run -a -s "-screen 0 1600x1000x24" bash app/packaging/linux/smoke_test.sh app/packaging/linux/dist/ExamGen-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: ExamGen-linux
          path: |
            app/packaging/linux/dist/ExamGen-x86_64.AppImage
            app/packaging/linux/dist/*.deb
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/packaging/linux/dist/ExamGen-x86_64.AppImage
            app/packaging/linux/dist/*.deb
