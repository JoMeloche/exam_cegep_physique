name: Docker image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "questions/**", "figures/**", "exams/**", "config.yaml", "docker-compose.yml", "tools/docker_smoke.py", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["app/**", "docker-compose.yml", "tools/docker_smoke.py", ".github/workflows/docker.yml"]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build the image (same command as the README)
        run: docker compose build

      - name: Start it with a first administrator
        env:
          EXAMGEN_ADMIN_EMAIL: ci@example.org
          EXAMGEN_ADMIN_PASSWORD: ci-password-0123456789
          EXAMGEN_DATA: ${{ runner.temp }}/mes_examens
        run: |
          mkdir -p "$EXAMGEN_DATA"
          docker compose up -d

      - name: Sign in, export an exam, download the PDFs
        run: python3 tools/docker_smoke.py http://127.0.0.1:8765 ci@example.org ci-password-0123456789

      - name: Container log
        if: always()
        run: docker compose logs --no-color | tail -n 100

      - name: Image size
        run: docker image ls ghcr.io/jomeloche/exam_cegep_physique
