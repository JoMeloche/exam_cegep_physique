name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Interface (type check + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  backend:
    name: Moteur (tests + banque de questions)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/pyproject.toml
      - name: Install LaTeX
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-lang-french \
            texlive-science texlive-pictures texlive-fonts-recommended lmodern
      - name: Install examgen
        run: pip install -e "app/backend[dev]"
      - name: Build a test library from the repository's question bank
        run: |
          lib="$RUNNER_TEMP/lib"
          mkdir -p "$lib"
          cp -r questions figures exams config.yaml "$lib/"
          sed -i "s/^school: ''/school: 'Cégep de test'/" "$lib/config.yaml"
          echo "EXAMGEN_TEST_LIB=$lib" >> "$GITHUB_ENV"
      - name: Validate every question
        run: EXAM_APP_HOME="$EXAMGEN_TEST_LIB" python -m examgen validate --no-compile
      - name: Tests
        working-directory: app/backend
        run: python -m pytest -q tests
