# Publishes the ready-to-run image to the GitHub Container Registry so that
#   docker compose pull && docker compose up -d
# works without building anything. Images:
#   ghcr.io/jomeloche/exam_cegep_physique:latest   every push to main
#   ghcr.io/jomeloche/exam_cegep_physique:1.0.0    each release tag (v1.0.0 or V1.0.0), plus :1.0 and :1
# Built natively for Intel/AMD (amd64) and ARM (arm64: Apple Silicon, Raspberry Pi, ARM servers).
name: Publish Docker image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*", "V*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jomeloche/exam_cegep_physique

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Keep the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          d="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${d#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version from the tag (v1.0.0 or V1.0.0 gives 1.0.0)
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "v=${GITHUB_REF_NAME#[vV]}" >> "$GITHUB_OUTPUT"; fi

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.v }},enable=${{ steps.ver.outputs.v != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.v }},enable=${{ steps.ver.outputs.v != '' }}
            type=semver,pattern={{major}},value=${{ steps.ver.outputs.v }},enable=${{ steps.ver.outputs.v != '' }}
            type=sha

      - name: Publish the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Show it
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
