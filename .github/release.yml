# Categories for the automatically generated release notes (Releases → Draft a new release → Generate release notes).
changelog:
  exclude:
    labels: [ignore-for-release]
  categories:
    - title: ✨ Nouveautés / New features
      labels: [enhancement, feature]
    - title: 📚 Banque de questions / Question bank
      labels: [questions]
    - title: 🐛 Corrections / Bug fixes
      labels: [bug]
    - title: 🖥️ Applications de bureau / Desktop apps
      labels: [packaging]
    - title: 📝 Documentation
      labels: [documentation]
    - title: 🔧 Autres changements / Other changes
      labels: ["*"]
