explanation: 'Le sens du champ magnétique dépend du sens du courant (règle de la main droite) : les pôles changent de côté, l''intensité reste la même.'
choices:
  - 'Son champ magnétique disparaît'
  - 'Son champ magnétique devient deux fois plus intense'
  - 'Rien ne change'
  - 'Ses pôles nord et sud s''inversent'
