title: Champ magnétique d'un solénoïde
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  L:  {type: integer, min: 10, max: 40, step: 2, unit: cm, si: 0.01, label: Longueur du solénoïde}
  N:  {type: integer, min: 200, max: 1200, step: 50, unit: '', label: Nombre de spires}
  I:  {type: decimal, min: 0.5, max: 5.0, step: 0.1, unit: A, label: Courant}
  Bc: {type: decimal, min: 5.0, max: 20.0, step: 0.5, unit: mT, si: 0.001, label: Champ visé}
constraints:
  - Bc*L/(1.257e-6*N) < 10
solution:
  mode: manual
  parts:
    a: {expr: "1.257e-6*N*I/L*1000", unit: mT, label: Champ magnétique}
    b: {expr: "2*1.257e-6*N*I/L*1000", unit: mT, label: Champ après compression}
    c: {expr: "Bc*L/(1.257e-6*N)", unit: A, label: Courant nécessaire}
