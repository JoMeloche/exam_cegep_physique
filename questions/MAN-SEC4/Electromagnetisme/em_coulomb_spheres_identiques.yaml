title: Charge de deux sphères identiques
type: developpement
points: 20
time_min: 15
difficulty: 4
figures: []
variables:
  r: {type: integer, min: 5, max: 40, step: 1, unit: cm, si: 0.01, label: Distance}
  F: {type: decimal, min: 0.2, max: 4.0, step: 0.1, unit: N, label: Force de répulsion}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "r*sqrt(F/8.99e9)", unit: C, label: Charge de chaque sphère}
    b: {expr: "r*sqrt(F/8.99e9)/e", unit: '', label: Nombre d'électrons en surplus}
    c: {expr: "F/9", unit: N, label: Force à distance triple}
