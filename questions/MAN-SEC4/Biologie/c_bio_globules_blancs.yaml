answer: B
explanation: 'Les globules blancs (leucocytes) reconnaissent et détruisent les micro-organismes. Les plaquettes servent à la coagulation, les globules rouges au transport de l''oxygène.'
choices:
  - 'Les globules rouges'
  - 'Les globules blancs'
  - 'Les plaquettes'
  - 'Le plasma'
