title: Masse du chargement d'un camion-citerne
type: developpement
points: 20
time_min: 12
difficulty: 2
figures: []
variables:
  rho: {type: integer, min: 680, max: 880, step: 10, unit: kg/m^3, label: Masse volumique du liquide}
  V:   {type: decimal, min: 10.0, max: 40.0, step: 0.5, unit: m^3, label: Volume de la citerne}
  mt:  {type: integer, min: 2000, max: 8000, step: 500, unit: kg, label: Masse livrée}
constraints:
  - mt < rho*V
solution:
  mode: manual
  parts:
    a: {expr: "rho*V", unit: kg, label: Masse du chargement}
    b: {expr: "rho/1000", unit: g/mL, label: Masse volumique en g/mL}
    c: {expr: "mt/rho*1000", unit: L, label: Volume livré}
