title: Une couronne en or pur ?
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  m:  {type: integer, min: 500, max: 1500, step: 10, unit: g, label: Masse de la couronne}
  dV: {type: decimal, min: 40.0, max: 110.0, step: 0.5, unit: mL, label: Volume d'eau déplacé}
constraints:
  - m/dV < 17.5
  - m/dV > 11
solution:
  mode: manual
  parts:
    a: {expr: "m/dV", unit: g/mL, label: Masse volumique de la couronne}
    b: {expr: "m/19.3", unit: mL, label: Volume d'une couronne d'or pur de même masse}
    c: {expr: "19.3*dV", unit: g, label: Masse d'une couronne d'or pur de même volume}
