explanation: 'La ductilité est la capacité d''un matériau à s''étirer sans se rompre. La malléabilité est l''équivalent pour l''aplatissement en feuilles.'
choices:
  - 'La dureté'
  - 'L''élasticité'
  - 'La ductilité'
  - 'La fragilité'
