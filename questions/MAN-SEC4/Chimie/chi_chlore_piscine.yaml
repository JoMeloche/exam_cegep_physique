title: Concentration en ppm du chlore d'une piscine
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  mc: {type: decimal, min: 0.2, max: 1.5, step: 0.1, unit: mg, label: Masse de chlore dans l'échantillon}
  Ve: {type: integer, min: 500, max: 1000, step: 100, unit: mL, label: Volume de l'échantillon}
  Vp: {type: integer, min: 40, max: 90, step: 5, unit: m^3, label: Volume de la piscine}
constraints:
  - mc/(Ve/1000) > 0.4
  - mc/(Ve/1000) < 2.6
solution:
  mode: manual
  parts:
    a: {expr: "mc/(Ve/1000)", unit: ppm, label: Concentration du chlore}
    b: {expr: "mc/(Ve/1000)*Vp", unit: g, label: Masse de chlore dans la piscine}
    c: {expr: "(3 - mc/(Ve/1000))*Vp", unit: g, label: Masse de chlore à ajouter}
