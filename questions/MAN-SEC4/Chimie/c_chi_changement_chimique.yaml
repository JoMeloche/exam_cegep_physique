title: 'Reconnaître un changement chimique'
type: conceptuel
points: 4
time_min: 3
difficulty: 1
figures: []
variables: {}
solution: {mode: none}
answer: B
explanation: 'La rouille est une nouvelle substance (oxyde de fer) formée par la réaction du fer avec le dioxygène : c''est une oxydation. Les trois autres sont des changements physiques, la substance reste la même.'
choices:
  - 'La glace qui fond au soleil'
  - 'Un clou de fer qui rouille'
  - 'Du sucre qui se dissout dans le thé'
  - 'L''eau qui bout dans une casserole'
