answer: A
explanation: 'Acide + base $\rightarrow$ sel + eau : HCl + NaOH $\rightarrow$ NaCl + H$_2$O. C''est une neutralisation acidobasique.'
choices:
  - 'Un sel et de l''eau'
  - 'Un acide plus faible et une base plus faible'
  - 'Du dioxyde de carbone et de l''eau'
  - 'Du dihydrogène et du dioxygène'
