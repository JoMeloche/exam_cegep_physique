title: Rendement d'une bouilloire électrique
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  P:   {type: integer, min: 1000, max: 2000, step: 100, unit: W, label: Puissance de la bouilloire}
  m:   {type: integer, min: 500, max: 1500, step: 100, unit: g, label: Masse d'eau}
  Ti:  {type: integer, min: 5, max: 25, step: 1, unit: \degreeCelsius, label: Température initiale}
  eta: {type: integer, min: 70, max: 95, step: 5, unit: \percent, label: Rendement}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "m*4.19*(100 - Ti)", unit: J, label: Énergie thermique reçue par l'eau}
    b: {expr: "m*4.19*(100 - Ti)/(eta/100)", unit: J, label: Énergie électrique consommée}
    c: {expr: "m*4.19*(100 - Ti)/(eta/100)/P", unit: s, label: Durée de chauffage}
