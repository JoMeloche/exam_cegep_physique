title: Rendement d'un treuil électrique
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  P: {type: integer, min: 200, max: 800, step: 50, unit: W, label: Puissance du moteur}
  t: {type: integer, min: 10, max: 40, step: 1, unit: s, label: Durée de la montée}
  m: {type: integer, min: 20, max: 80, step: 5, unit: kg, label: Masse soulevée}
  h: {type: decimal, min: 2.0, max: 10.0, step: 0.5, unit: m, label: Hauteur}
constraints:
  - m*9.8*h > 0.4*P*t
  - m*9.8*h < 0.9*P*t
solution:
  mode: manual
  parts:
    a: {expr: "P*t", unit: J, label: Énergie consommée}
    b: {expr: "m*9.8*h", unit: J, label: Énergie utile}
    c: {expr: "100*m*9.8*h/(P*t)", unit: "%", label: Rendement}
    d: {expr: "P*t - m*9.8*h", unit: J, label: Énergie dissipée}
