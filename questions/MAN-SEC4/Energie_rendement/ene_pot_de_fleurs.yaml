title: Chute d'un pot de fleurs
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  m:  {type: decimal, min: 0.5, max: 4.0, step: 0.5, unit: kg, label: Masse du pot}
  h:  {type: decimal, min: 3.0, max: 15.0, step: 0.5, unit: m, label: Hauteur du balcon}
  pe: {type: integer, min: 5, max: 25, step: 1, unit: \percent, label: Énergie perdue par frottement}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "m*9.8*h", unit: J, label: Énergie potentielle}
    b: {expr: "sqrt(2*9.8*h)", unit: m/s, label: Vitesse sans frottement}
    c1: {expr: "(1 - pe/100)*m*9.8*h", unit: J, label: Énergie cinétique avec frottement}
    c2: {expr: "sqrt(2*(1 - pe/100)*9.8*h)", unit: m/s, label: Vitesse avec frottement}
