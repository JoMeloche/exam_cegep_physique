title: Trois résistors en série
type: developpement
points: 20
time_min: 12
difficulty: 2
figures: []
variables:
  U:  {type: choice, values: [6, 9, 12, 18, 24], unit: V, label: Tension de la pile}
  R1: {type: integer, min: 10, max: 100, step: 5, unit: \ohm, label: Résistance 1}
  R2: {type: integer, min: 10, max: 100, step: 5, unit: \ohm, label: Résistance 2}
  R3: {type: integer, min: 10, max: 100, step: 5, unit: \ohm, label: Résistance 3}
constraints:
  - R1 != R2
  - R2 != R3
solution:
  mode: manual
  parts:
    a: {expr: "R1 + R2 + R3", unit: \ohm, label: Résistance équivalente}
    b: {expr: "U/(R1 + R2 + R3)", unit: A, label: Courant}
    c1: {expr: "R1*U/(R1 + R2 + R3)", unit: V, label: Tension aux bornes de R1}
    c2: {expr: "R2*U/(R1 + R2 + R3)", unit: V, label: Tension aux bornes de R2}
    c3: {expr: "R3*U/(R1 + R2 + R3)", unit: V, label: Tension aux bornes de R3}
