title: Deux ampoules en série
type: developpement
points: 20
time_min: 18
difficulty: 4
figures: []
variables:
  P1: {type: choice, values: [40, 60, 75], unit: W, label: Puissance nominale de l'ampoule 1}
  P2: {type: choice, values: [100, 120, 150], unit: W, label: Puissance nominale de l'ampoule 2}
constraints: []
solution:
  mode: manual
  parts:
    a1: {expr: "120**2/P1", unit: \ohm, label: Résistance de l'ampoule 1}
    a2: {expr: "120**2/P2", unit: \ohm, label: Résistance de l'ampoule 2}
    b: {expr: "120/(120**2/P1 + 120**2/P2)", unit: A, label: Courant en série}
    c1: {expr: "120**2/P1*(120/(120**2/P1 + 120**2/P2))**2", unit: W, label: Puissance dissipée par l'ampoule 1}
    c2: {expr: "120**2/P2*(120/(120**2/P1 + 120**2/P2))**2", unit: W, label: Puissance dissipée par l'ampoule 2}
