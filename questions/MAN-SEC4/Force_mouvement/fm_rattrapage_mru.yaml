title: Voiture qui rattrape un camion
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  vT: {type: integer, min: 70, max: 95, step: 5, unit: km/h, si: 0.2777777777777778, label: Vitesse du camion}
  vV: {type: integer, min: 100, max: 120, step: 5, unit: km/h, si: 0.2777777777777778, label: Vitesse de la voiture}
  d:  {type: integer, min: 100, max: 800, step: 50, unit: m, label: Distance initiale}
constraints: []
solution:
  mode: manual
  parts:
    a1: {expr: "vT", unit: m/s, label: Vitesse du camion}
    a2: {expr: "vV", unit: m/s, label: Vitesse de la voiture}
    b: {expr: "d/(vV - vT)", unit: s, label: Temps de rattrapage}
    c: {expr: "vV*d/(vV - vT)", unit: m, label: Distance parcourue par la voiture}
