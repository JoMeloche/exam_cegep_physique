title: Deuxième loi de Newton pour un chariot
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  m: {type: integer, min: 10, max: 60, step: 2, unit: kg, label: Masse du chariot}
  F: {type: integer, min: 40, max: 200, step: 5, unit: N, label: Force appliquée}
  f: {type: integer, min: 10, max: 80, step: 5, unit: N, label: Force de frottement}
  t: {type: decimal, min: 2.0, max: 8.0, step: 0.5, unit: s, label: Durée}
constraints:
  - F > f + 15
solution:
  mode: manual
  parts:
    a: {expr: "F - f", unit: N, label: Force résultante}
    b: {expr: "(F - f)/m", unit: m/s^2, label: Accélération}
    c1: {expr: "(F - f)/m*t", unit: m/s, label: Vitesse finale}
    c2: {expr: "(F - f)/m*t**2/2", unit: m, label: Distance parcourue}
