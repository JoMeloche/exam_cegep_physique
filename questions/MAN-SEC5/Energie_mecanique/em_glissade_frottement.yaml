title: Glissade avec frottement (énergie perdue)
type: developpement
points: 20
time_min: 14
difficulty: 3
figures: []
tags: [énergie, frottement, travail]
variables:
  m: {type: integer, min: 18, max: 45, step: 1, unit: kg, label: Masse de l'enfant}
  h: {type: decimal, min: 2.0, max: 5.0, step: 0.5, unit: m, label: Hauteur de la glissade}
  L: {type: decimal, min: 4.0, max: 10.0, step: 0.5, unit: m, label: Longueur de la glissade}
  v: {type: decimal, min: 2.5, max: 8.0, step: 0.1, unit: m/s, label: Vitesse au bas}
constraints:
  - v < 0.85*sqrt(2*g*h)
  - v > 0.45*sqrt(2*g*h)
  - L > 1.5*h
solution:
  mode: manual
  parts:
    a: {expr: "m*g*h", unit: J, label: Énergie mécanique au sommet}
    b: {expr: "m*v**2/2", unit: J, label: Énergie cinétique au bas}
    c: {expr: "m*g*h - m*v**2/2", unit: J, label: Énergie dissipée}
    d: {expr: "(m*g*h - m*v**2/2)/L", unit: N, label: Force de frottement moyenne}
