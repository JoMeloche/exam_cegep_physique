title: Wagon de montagnes russes sans frottement
type: developpement
points: 20
time_min: 16
difficulty: 3
figures: []
tags: [conservation de l'énergie]
variables:
  m:  {type: integer, min: 300, max: 800, step: 50, unit: kg, label: Masse du wagon}
  hA: {type: integer, min: 25, max: 50, step: 1, unit: m, label: Hauteur du point A}
  vA: {type: decimal, min: 1.0, max: 6.0, step: 0.5, unit: m/s, label: Vitesse au point A}
  hC: {type: integer, min: 10, max: 35, step: 1, unit: m, label: Hauteur du point C}
constraints:
  - hC < hA - 5
solution:
  mode: manual
  parts:
    a: {expr: "m*g*hA + m*vA**2/2", unit: J, label: Énergie mécanique}
    b: {expr: "sqrt(vA**2 + 2*g*hA)", unit: m/s, label: Vitesse en B}
    c: {expr: "sqrt(vA**2 + 2*g*(hA - hC))", unit: m/s, label: Vitesse en C}
    d: {expr: "hA + vA**2/(2*g)", unit: m, label: Hauteur maximale}
