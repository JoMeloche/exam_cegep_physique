explanation: '$m g h = \tfrac{1}{2} m v^2$ donne $v = \sqrt{2gh}$ : la masse s''annule. B a deux fois plus d''énergie, mais la même vitesse.'
choices:
  - 'Elles ont la même vitesse'
  - 'B est deux fois plus rapide'
  - 'B est $\sqrt{2}$ fois plus rapide'
