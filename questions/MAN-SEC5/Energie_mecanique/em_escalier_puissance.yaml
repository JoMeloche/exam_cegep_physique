title: Monter les escaliers en courant (énergie et puissance)
type: developpement
points: 20
time_min: 10
difficulty: 2
figures: []
tags: [travail, puissance]
variables:
  m: {type: integer, min: 45, max: 90, step: 1, unit: kg, label: Masse de l'élève}
  h: {type: decimal, min: 6.0, max: 15.0, step: 0.5, unit: m, label: Hauteur des escaliers}
  t: {type: decimal, min: 8.0, max: 25.0, step: 0.5, unit: s, label: Durée de la montée}
  P: {type: choice, values: [9, 12, 15, 40, 60], unit: W, label: Puissance de l'ampoule}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "m*g*h", unit: J, label: Énergie potentielle gagnée}
    b: {expr: "m*g*h/t", unit: W, label: Puissance moyenne}
    c: {expr: "m*g*h/P", unit: s, label: Durée d'allumage}
