title: Travail, puissance et rendement d'une grue
type: developpement
points: 20
time_min: 13
difficulty: 3
figures: []
tags: [travail, puissance, rendement]
variables:
  m:  {type: integer, min: 200, max: 1000, step: 50, unit: kg, label: Masse de la palette}
  h:  {type: integer, min: 10, max: 40, step: 2, unit: m, label: Hauteur de levage}
  t:  {type: integer, min: 15, max: 60, step: 5, unit: s, label: Durée du levage}
  Pm: {type: decimal, min: 2.0, max: 20.0, step: 0.5, unit: kW, si: 1000, label: Puissance consommée}
constraints:
  - m*g*h/t/Pm > 0.45
  - m*g*h/t/Pm < 0.92
solution:
  mode: manual
  parts:
    a: {expr: "m*g*h", unit: J, label: Travail}
    b: {expr: "m*g*h/t", unit: W, label: Puissance utile}
    c: {expr: "100*m*g*h/t/Pm", unit: '\%', label: Rendement}
