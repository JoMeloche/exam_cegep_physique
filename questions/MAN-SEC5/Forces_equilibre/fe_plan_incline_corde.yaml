title: 'Bloc retenu par une corde sur un plan incliné'
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  m:  {type: integer, min: 5, max: 40, step: 1, unit: kg, label: Masse du bloc}
  th: {type: integer, min: 10, max: 45, step: 1, unit: \degree, label: Inclinaison du plan}
constraints: []
solution:
  mode: manual
  parts:
    a1: {expr: "m*g*sin(rad(th))", unit: N, label: Composante du poids parallèle au plan}
    a2: {expr: "m*g*cos(rad(th))", unit: N, label: Composante du poids perpendiculaire au plan}
    b: {expr: "m*g*sin(rad(th))", unit: N, label: Tension dans la corde}
    c: {expr: "tan(rad(th))", unit: "", label: Coefficient de frottement statique minimal}
