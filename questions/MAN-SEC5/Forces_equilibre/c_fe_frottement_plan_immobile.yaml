solution: {mode: none}
answer: C
explanation: 'La composante du poids parallèle au plan tire la boîte vers le bas de la pente ; le frottement statique s''y oppose pour assurer l''équilibre.'
choices:
  - 'Parallèle au plan, vers le bas de la pente'
  - 'Perpendiculaire au plan'
  - 'Parallèle au plan, vers le haut de la pente'
  - 'Verticale, vers le haut'
