title: 'Résultante et équilibrante de deux forces perpendiculaires'
type: developpement
points: 20
time_min: 12
difficulty: 2
figures: []
variables:
  F1: {type: integer, min: 20, max: 90, step: 1, unit: N, label: Force vers l'est}
  F2: {type: integer, min: 20, max: 90, step: 1, unit: N, label: Force vers le nord}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "sqrt(F1**2 + F2**2)", unit: N, label: Grandeur de la résultante}
    b: {expr: "deg(atan(F2/F1))", unit: \degree, label: Orientation de la résultante (de l'est vers le nord)}
    c: {expr: "sqrt(F1**2 + F2**2)", unit: N, label: Grandeur de l'équilibrante}
