title: 'Force résultante à vitesse constante'
type: conceptuel
points: 4
time_min: 4
difficulty: 2
figures: []
variables: {}
solution: {mode: none}
answer: A
explanation: 'Selon la première loi de Newton, un objet à vitesse constante en ligne droite est en équilibre : la force motrice compense exactement les frottements.'
choices:
  - 'Elle est nulle'
  - 'Elle pointe vers l''avant, dans le sens du mouvement'
  - 'Elle pointe vers l''arrière, à cause du frottement'
  - 'Elle est égale au poids de la voiture'
