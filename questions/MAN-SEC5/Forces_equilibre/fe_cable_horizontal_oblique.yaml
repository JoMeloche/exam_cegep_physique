title: 'Feu de circulation retenu par un câble horizontal et un câble oblique'
type: developpement
points: 20
time_min: 15
difficulty: 4
figures: []
variables:
  m:  {type: decimal, min: 10.0, max: 40.0, step: 0.5, unit: kg, label: Masse du feu de circulation}
  th: {type: integer, min: 25, max: 65, step: 5, unit: \degree, label: Angle du câble oblique avec l'horizontale}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "m*g", unit: N, label: Poids du feu}
    b: {expr: "m*g/sin(rad(th))", unit: N, label: Tension dans le câble oblique}
    c: {expr: "m*g/tan(rad(th))", unit: N, label: Tension dans le câble horizontal}
