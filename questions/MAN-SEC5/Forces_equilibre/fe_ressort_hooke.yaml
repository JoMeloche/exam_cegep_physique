title: 'Loi de Hooke : ressort vertical et masses suspendues'
type: developpement
points: 20
time_min: 13
difficulty: 2
figures: []
variables:
  L0: {type: decimal, min: 8.0, max: 20.0, step: 0.5, unit: cm, si: 0.01, label: Longueur au repos}
  dx: {type: decimal, min: 2.0, max: 12.0, step: 0.5, unit: cm, si: 0.01, label: Allongement avec la première masse}
  m:  {type: integer, min: 100, max: 600, step: 50, unit: g, si: 0.001, label: Première masse}
  m2: {type: integer, min: 100, max: 800, step: 50, unit: g, si: 0.001, label: Deuxième masse}
constraints:
  - 'abs(m2 - m) > 0.04'
solution:
  mode: manual
  parts:
    a: {expr: "m*g", unit: N, label: Force exercée par le ressort}
    b: {expr: "m*g/dx", unit: N/m, label: Constante de rappel}
    c: {expr: "100*(L0 + m2*dx/m)", unit: cm, label: Longueur avec la deuxième masse}
