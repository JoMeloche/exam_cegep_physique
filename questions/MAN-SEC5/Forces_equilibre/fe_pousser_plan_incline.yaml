title: 'Pousser une caisse vers le haut d''un plan incliné avec frottement'
type: developpement
points: 20
time_min: 16
difficulty: 4
figures: []
variables:
  m:   {type: integer, min: 10, max: 60, step: 1, unit: kg, label: Masse de la caisse}
  th:  {type: integer, min: 10, max: 35, step: 1, unit: \degree, label: Inclinaison de la rampe}
  muk: {type: decimal, min: 0.10, max: 0.40, step: 0.05, label: Coefficient de frottement cinétique}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "m*g*sin(rad(th))", unit: N, label: Composante du poids parallèle à la rampe}
    b: {expr: "muk*m*g*cos(rad(th))", unit: N, label: Force de frottement cinétique}
    c: {expr: "m*g*(sin(rad(th)) + muk*cos(rad(th)))", unit: N, label: Poussée pour monter à vitesse constante}
