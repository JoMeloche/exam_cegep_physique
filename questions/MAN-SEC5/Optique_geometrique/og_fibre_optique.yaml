title: 'Réflexion totale dans une fibre optique'
type: developpement
points: 20
time_min: 15
difficulty: 4
figures: []
variables:
  n1: {type: choice, values: [1.48, 1.50, 1.52, 1.55], label: Indice du cœur}
  dn: {type: choice, values: [0.01, 0.02, 0.03, 0.04], label: Écart d'indice entre le cœur et la gaine}
  L:  {type: integer, min: 2, max: 50, step: 1, unit: km, si: 1000, label: Longueur de la fibre}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "deg(asin((n1 - dn)/n1))", unit: \degree, label: Angle critique cœur-gaine}
    b: {expr: "c/n1", unit: m/s, label: Vitesse de la lumière dans le cœur}
    c: {expr: "1e6*L*n1/c", unit: \micro\second, label: Durée minimale du trajet}
