title: 'Choisir la lentille d''un projecteur'
type: developpement
points: 20
time_min: 15
difficulty: 4
figures: []
variables:
  ho: {type: integer, min: 20, max: 36, step: 1, unit: mm, si: 0.001, label: Hauteur de l'image sur la diapositive}
  di: {type: decimal, min: 2.0, max: 8.0, step: 0.5, unit: m, label: Distance lentille-écran}
  hi: {type: decimal, min: 0.8, max: 2.5, step: 0.1, unit: m, label: Hauteur voulue de l'image sur l'écran}
constraints:
  - 'di*ho/hi > 0.05'
  - 'di*ho/hi < 0.25'
solution:
  mode: manual
  parts:
    a: {expr: "-hi/ho", unit: "", label: Grandissement}
    b: {expr: "100*di*ho/hi", unit: cm, label: Distance diapositive-lentille}
    c: {expr: "100/(hi/(di*ho) + 1/di)", unit: cm, label: Distance focale de la lentille}
