title: 'Rétroviseur convexe'
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  R:  {type: decimal, min: 0.8, max: 3.0, step: 0.1, unit: m, label: Rayon de courbure du rétroviseur}
  dob: {type: integer, min: 5, max: 40, step: 1, unit: m, label: Distance de l'auto qui suit}
  ho: {type: decimal, min: 1.4, max: 2.0, step: 0.1, unit: m, label: Hauteur de l'auto}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "-R/2", unit: m, label: Distance focale}
    b: {expr: "1/(-2/R - 1/dob)", unit: m, label: Distance de l'image}
    c: {expr: "-100*ho*(1/(-2/R - 1/dob))/dob", unit: cm, label: Hauteur de l'image}
