title: 'Image réelle par une lentille convergente'
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  f:  {type: decimal, min: 5.0, max: 25.0, step: 0.5, unit: cm, si: 0.01, label: Distance focale}
  dob: {type: integer, min: 15, max: 80, step: 1, unit: cm, si: 0.01, label: Distance de l'objet}
  ho: {type: decimal, min: 1.0, max: 5.0, step: 0.5, unit: cm, si: 0.01, label: Hauteur de l'objet}
constraints:
  - 'dob > 1.3*f'
solution:
  mode: manual
  parts:
    a: {expr: "100/(1/f - 1/dob)", unit: cm, label: Distance de l'image}
    b: {expr: "-(1/(1/f - 1/dob))/dob", unit: "", label: Grandissement}
    c: {expr: "-100*ho*(1/(1/f - 1/dob))/dob", unit: cm, label: Hauteur de l'image}
