title: 'Image par un miroir concave'
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  R:  {type: integer, min: 20, max: 80, step: 2, unit: cm, si: 0.01, label: Rayon de courbure}
  dob: {type: integer, min: 20, max: 120, step: 1, unit: cm, si: 0.01, label: Distance de l'objet}
  ho: {type: decimal, min: 1.0, max: 6.0, step: 0.5, unit: cm, si: 0.01, label: Hauteur de l'objet}
constraints:
  - 'dob > 1.3*R/2'
solution:
  mode: manual
  parts:
    a: {expr: "100*R/2", unit: cm, label: Distance focale}
    b: {expr: "100/(2/R - 1/dob)", unit: cm, label: Distance de l'image}
    c: {expr: "-100*ho*(1/(2/R - 1/dob))/dob", unit: cm, label: Hauteur de l'image}
