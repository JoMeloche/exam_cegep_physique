title: 'Fréquence, période et vitesse des vagues'
type: developpement
points: 20
time_min: 12
difficulty: 2
figures: []
variables:
  lam: {type: decimal, min: 1.5, max: 8.0, step: 0.5, unit: m, label: Distance entre deux crêtes}
  N:   {type: integer, min: 5, max: 20, step: 1, label: Nombre de vagues}
  t:   {type: integer, min: 20, max: 90, step: 5, unit: s, label: Durée de l'observation}
constraints:
  - 'lam*N/t > 0.4'
  - 'lam*N/t < 5'
solution:
  mode: manual
  parts:
    a: {expr: "N/t", unit: Hz, label: Fréquence}
    b: {expr: "t/N", unit: s, label: Période}
    c: {expr: "lam*N/t", unit: m/s, label: Vitesse des vagues}
