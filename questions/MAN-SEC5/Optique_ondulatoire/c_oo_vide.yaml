title: 'Propagation dans le vide'
type: conceptuel
points: 4
time_min: 4
difficulty: 2
figures: []
variables: {}
solution: {mode: none}
answer: B
explanation: 'Le son est une onde mécanique : il a besoin de particules pour se propager. La lumière, une onde électromagnétique, se propage dans le vide.'
choices:
  - 'Le son est trop lent pour arriver jusqu''à lui'
  - 'La lumière peut voyager dans le vide, mais pas le son'
  - 'Le son est absorbé par la lumière'
  - 'La fréquence du son est trop basse dans le vide'
