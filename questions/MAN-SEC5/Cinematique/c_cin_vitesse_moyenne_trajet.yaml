explanation: 'Montée : $\frac{6}{12} = \qty{0.5}{h}$, descente : $\frac{6}{36} = \frac{1}{6}\,\unit{h}$. Distance totale \qty{12}{km} en $\frac{2}{3}\,\unit{h}$, soit \qty{18}{km/h}. La moyenne des vitesses (\qty{24}{km/h}) ne convient pas parce qu''il passe plus de temps à monter.'
