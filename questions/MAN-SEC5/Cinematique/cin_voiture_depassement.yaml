  a: {type: decimal, min: 1.0, max: 2.5, step: 0.1, unit: m/s^2, label: Accélération}
  t: {type: decimal, min: 3.0, max: 6.0, step: 0.5, unit: s, label: Durée de l'accélération}
constraints: []
solution:
  mode: manual
  file: cin_voiture_depassement.sol.tex
  parts:
    a: {expr: 'v1 + a*t', unit: 'm/s', label: 'Vitesse finale'}
