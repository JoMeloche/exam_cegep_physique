solution: {mode: none}
answer: B
explanation: 'Troisième loi de Newton : les deux forces sont égales en grandeur et opposées. C''est l''accélération ($a = F/m$) qui est plus grande pour la voiture.'
choices:
  - 'La force sur la voiture est plus grande'
  - 'Les deux forces ont la même grandeur'
  - 'La force sur le camion est plus grande'
  - 'Cela dépend de leurs vitesses'
