title: Traîneau tiré sur la neige avec frottement
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
tags: [deuxième loi, frottement]
variables:
  m:  {type: integer, min: 20, max: 60, step: 5, unit: kg, label: Masse du traîneau}
  F:  {type: integer, min: 40, max: 160, step: 5, unit: N, label: Force de la corde}
  mu: {type: decimal, min: 0.10, max: 0.40, step: 0.05, label: Coefficient de frottement cinétique}
  t:  {type: integer, min: 2, max: 5, step: 1, unit: s, label: Durée}
constraints:
  - F > 1.3*mu*m*g
  - (F - mu*m*g)/m < 2.5
solution:
  mode: manual
  parts:
    a: {expr: "m*g", unit: N, label: Force normale}
    b: {expr: "mu*m*g", unit: N, label: Force de frottement}
    c: {expr: "(F - mu*m*g)/m", unit: m/s^2, label: Accélération}
    d: {expr: "(F - mu*m*g)/m*t", unit: m/s, label: Vitesse après la durée donnée}
