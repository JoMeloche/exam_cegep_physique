solution: {mode: none}
answer: A
explanation: 'Vitesse constante signifie accélération nulle, donc, par la deuxième loi, une force résultante nulle : la poussée vers le haut compense exactement le poids.'
choices:
  - 'Elle est nulle'
  - 'Elle est dirigée vers le haut'
  - 'Elle est dirigée vers le bas'
  - 'Elle est égale au poids de la montgolfière'
