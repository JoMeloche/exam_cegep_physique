title: Caisse sur une rampe sans frottement
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
tags: [plan incliné, deuxième loi]
variables:
  m:  {type: integer, min: 5, max: 40, step: 5, unit: kg, label: Masse de la caisse}
  th: {type: integer, min: 15, max: 40, step: 5, unit: \degree, label: Angle de la rampe}
  L:  {type: decimal, min: 2.0, max: 8.0, step: 0.5, unit: m, label: Longueur de la rampe}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "m*g*sin(rad(th))", unit: N, label: Composante parallèle du poids}
    b: {expr: "m*g*cos(rad(th))", unit: N, label: Force normale}
    c: {expr: "g*sin(rad(th))", unit: m/s^2, label: Accélération}
    d: {expr: "sqrt(2*g*sin(rad(th))*L)", unit: m/s, label: Vitesse au bas}
