title: Pèse-personne dans un ascenseur
type: developpement
points: 20
time_min: 12
difficulty: 3
figures: []
tags: [deuxième loi, poids apparent]
variables:
  m: {type: integer, min: 50, max: 95, step: 1, unit: kg, label: Masse de la personne}
  a: {type: decimal, min: 0.5, max: 3.0, step: 0.1, unit: m/s^2, label: Accélération de l'ascenseur}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "m*(g + a)", unit: N, label: Lecture en accélérant vers le haut}
    b: {expr: "m*g", unit: N, label: Lecture à vitesse constante}
    c: {expr: "m*(g - a)", unit: N, label: Lecture en accélérant vers le bas}
