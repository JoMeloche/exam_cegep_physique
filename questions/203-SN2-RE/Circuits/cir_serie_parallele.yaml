title: Résistances en série et en parallèle
type: developpement
points: 20
time_min: 14
difficulty: 2
figures: []
variables:
  eps: {type: integer, min: 6, max: 24, step: 1, unit: V, label: Force électromotrice de la pile}
  R1: {type: integer, min: 10, max: 100, step: 5, unit: \ohm, label: Résistance R1}
  R2: {type: integer, min: 20, max: 200, step: 10, unit: \ohm, label: Résistance R2}
  R3: {type: integer, min: 20, max: 200, step: 10, unit: \ohm, label: Résistance R3}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "R1 + R2*R3/(R2 + R3)", unit: \ohm, label: Résistance équivalente}
    b: {expr: "eps/(R1 + R2*R3/(R2 + R3))", unit: A, label: Courant fourni par la pile}
    c: {expr: "eps*(R2*R3/(R2 + R3))/(R1 + R2*R3/(R2 + R3))/R2", unit: A, label: Courant dans R2}
    d: {expr: "R1*(eps/(R1 + R2*R3/(R2 + R3)))**2", unit: W, label: Puissance dissipée dans R1}
