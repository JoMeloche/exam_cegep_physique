solution: {mode: none}
answer: B
explanation: 'Ce temps est la constante de temps $\tau = RC$. Avec $2R$ et $C/2$, on obtient $\tau'' = (2R)(C/2) = RC$ : le temps ne change pas.'
choices:
  - Il double
  - Il reste le même
  - Il est divisé par deux
  - Il est multiplié par quatre
