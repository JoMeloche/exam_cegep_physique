title: Décharge d'un condensateur dans une résistance
type: developpement
points: 20
time_min: 14
difficulty: 3
figures: []
tags: [RC]
variables:
  C: {type: integer, min: 20, max: 500, step: 10, unit: \micro\farad, si: 1e-6, label: Capacité}
  V0: {type: integer, min: 10, max: 60, step: 2, unit: V, label: Tension initiale}
  R: {type: decimal, min: 0.5, max: 20.0, step: 0.5, unit: \kilo\ohm, si: 1000, label: Résistance}
  p: {type: integer, min: 10, max: 60, step: 5, unit: \percent, si: 0.01, label: Fraction de la tension initiale}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "V0/R", unit: A, label: Courant initial}
    b: {expr: "-R*C*log(p)", unit: s, label: Temps de décharge}
    c: {expr: "0.5*C*V0**2*(1 - p**2)", unit: J, label: Énergie dissipée}
