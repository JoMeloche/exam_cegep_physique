title: Résistance d'un filament chaud
type: developpement
points: 20
time_min: 12
difficulty: 3
figures: []
variables:
  R0: {type: decimal, min: 10.0, max: 30.0, step: 0.5, unit: \ohm, label: Résistance à 20 °C}
  T:  {type: integer, min: 1800, max: 2800, step: 100, unit: \celsius, label: Température de fonctionnement}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "R0*(1 + 4.5e-3*(T - 20))", unit: \ohm, label: Résistance à chaud}
    b1: {expr: "120/(R0*(1 + 4.5e-3*(T - 20)))", unit: A, label: Courant en fonctionnement}
    b2: {expr: "120**2/(R0*(1 + 4.5e-3*(T - 20)))", unit: W, label: Puissance en fonctionnement}
    c: {expr: "120/R0", unit: A, label: Courant à l'allumage}
