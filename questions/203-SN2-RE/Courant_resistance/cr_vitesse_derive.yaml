title: Vitesse de dérive des électrons dans le cuivre
type: developpement
points: 20
time_min: 12
difficulty: 3
figures: []
variables:
  d: {type: decimal, min: 0.5, max: 3.0, step: 0.1, unit: mm, si: 0.001, label: Diamètre du fil}
  I: {type: decimal, min: 0.5, max: 20.0, step: 0.5, unit: A, label: Courant}
constraints:
  - I/(pi*(d/2)**2) <= 1.5e7
solution:
  mode: manual
  parts:
    a: {expr: "I/(pi*(d/2)**2)", unit: A/m^2, label: Densité de courant}
    b: {expr: "I/(pi*(d/2)**2*8.49e28*1.602e-19)", unit: m/s, label: Vitesse de dérive}
    c: {expr: "pi*(d/2)**2*8.49e28*1.602e-19/I", unit: s, label: Temps pour parcourir 1 m}
