title: Champ magnétique dans un solénoïde
type: developpement
points: 20
time_min: 13
difficulty: 2
figures: []
variables:
  L: {type: integer, min: 10, max: 60, step: 5, unit: cm, si: 0.01, label: Longueur du solénoïde}
  r: {type: decimal, min: 0.5, max: 3.0, step: 0.5, unit: cm, si: 0.01, label: Rayon du solénoïde}
  N: {type: integer, min: 100, max: 2000, step: 50, unit: '', label: Nombre de spires}
  I: {type: decimal, min: 0.5, max: 10.0, step: 0.5, unit: A, label: Courant}
  Bt: {type: integer, min: 1, max: 30, step: 1, unit: mT, si: 0.001, label: Champ visé}
constraints:
  - L > 5*r
solution:
  mode: manual
  parts:
    a: {expr: "N/L", unit: m^-1, label: Spires par mètre}
    b: {expr: "4*pi*1e-7*N/L*I", unit: T, label: Champ dans le solénoïde}
    c: {expr: "4*pi*1e-7*N/L*I*pi*r**2", unit: Wb, label: Flux à travers une spire}
    d: {expr: "Bt/(4*pi*1e-7*N/L)", unit: A, label: Courant pour le champ visé}
