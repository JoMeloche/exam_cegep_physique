title: Champ d'une bobine circulaire plate
type: developpement
points: 20
time_min: 14
difficulty: 3
figures: []
variables:
  R: {type: decimal, min: 2.0, max: 15.0, step: 0.5, unit: cm, si: 0.01, label: Rayon de la bobine}
  N: {type: integer, min: 10, max: 200, step: 10, unit: '', label: Nombre de spires}
  I: {type: decimal, min: 0.5, max: 8.0, step: 0.5, unit: A, label: Courant}
  z: {type: decimal, min: 1.0, max: 20.0, step: 0.5, unit: cm, si: 0.01, label: Distance sur l'axe}
constraints:
  - z <= 2*R
solution:
  mode: manual
  parts:
    a: {expr: "4*pi*1e-7*N*I/(2*R)", unit: T, label: Champ au centre}
    b: {expr: "4*pi*1e-7*N*I*R**2/(2*(R**2 + z**2)**1.5)", unit: T, label: Champ sur l'axe}
    c: {expr: "sqrt(3)*R", unit: m, label: Distance où B vaut B0/8}
