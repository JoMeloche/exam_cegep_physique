title: 'Deux fils parcourus par des courants opposés'
type: developpement
points: 20
time_min: 14
difficulty: 3
figures: []
variables:
  I: {type: integer, min: 5, max: 40, step: 5, unit: A, label: Courant dans chaque fil}
  d: {type: integer, min: 2, max: 20, step: 1, unit: cm, si: 0.01, label: Distance entre les fils}
  L: {type: decimal, min: 0.5, max: 3.0, step: 0.5, unit: m, label: Longueur considérée}
constraints: []
solution:
  mode: manual
  file: scm_fils_courants_opposes.sol.tex
  parts:
    a: {expr: '(4*pi*1e-7)*I/(2*pi*d/2)', unit: 'T', label: 'Champ d''un fil au milieu'}
    b: {expr: '2*(4*pi*1e-7)*I/(2*pi*d/2)', unit: 'T', label: 'Champ résultant au milieu'}
    c: {expr: '(4*pi*1e-7)*I**2*L/(2*pi*d)', unit: 'N', label: 'Force entre les fils'}
