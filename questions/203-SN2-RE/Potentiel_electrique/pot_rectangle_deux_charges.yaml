title: Potentiel et énergie de deux charges
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  q1: {type: decimal, min: 1.0, max: 8.0, step: 0.5, unit: \micro\coulomb, si: 1e-6, label: Charge 1}
  q2: {type: decimal, min: -8.0, max: -1.0, step: 0.5, unit: \micro\coulomb, si: 1e-6, label: Charge 2}
  q3: {type: decimal, min: 1.0, max: 5.0, step: 0.5, unit: \micro\coulomb, si: 1e-6, label: Charge amenée en P}
  a:  {type: integer, min: 10, max: 40, step: 2, unit: cm, si: 0.01, label: Distance entre q1 et q2}
  b:  {type: integer, min: 10, max: 30, step: 2, unit: cm, si: 0.01, label: Distance de q1 au point P}
constraints:
  - abs(q1/b + q2/sqrt(a**2 + b**2)) > 0.1*abs(q1/b)
solution:
  mode: manual
  parts:
    a: {expr: "8.99e9*(q1/b + q2/sqrt(a**2 + b**2))", unit: V, label: Potentiel en P}
    b: {expr: "8.99e9*q1*q2/a", unit: J, label: Énergie potentielle du système}
    c: {expr: "q3*8.99e9*(q1/b + q2/sqrt(a**2 + b**2))", unit: J, label: Travail de l'agent extérieur}
