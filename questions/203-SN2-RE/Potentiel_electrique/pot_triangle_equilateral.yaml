title: Énergie de trois charges en triangle
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  a:  {type: integer, min: 5, max: 30, step: 1, unit: cm, si: 0.01, label: Côté du triangle}
  q1: {type: decimal, min: 1.0, max: 6.0, step: 0.5, unit: \micro\coulomb, si: 1e-6, label: Charge 1}
  q2: {type: decimal, min: 1.0, max: 6.0, step: 0.5, unit: \micro\coulomb, si: 1e-6, label: Charge 2}
  q3: {type: decimal, min: -6.0, max: -1.0, step: 0.5, unit: \micro\coulomb, si: 1e-6, label: Charge 3}
  q4: {type: integer, min: 10, max: 90, step: 10, unit: nC, si: 1e-9, label: Charge amenée au centre}
constraints:
  - abs(q1*q2 + q1*q3 + q2*q3) > 0.5e-12
  - abs(q1 + q2 + q3) > 0.4e-6
solution:
  mode: manual
  parts:
    a: {expr: "8.99e9*(q1*q2 + q1*q3 + q2*q3)/a", unit: J, label: Énergie potentielle totale}
    b: {expr: "8.99e9*(q1 + q2 + q3)*sqrt(3)/a", unit: V, label: Potentiel au centre}
    c: {expr: "q4*8.99e9*(q1 + q2 + q3)*sqrt(3)/a", unit: J, label: Travail de l'agent extérieur}
