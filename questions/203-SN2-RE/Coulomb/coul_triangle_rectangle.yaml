title: Force résultante dans un triangle rectangle
type: developpement
points: 20
time_min: 18
difficulty: 4
figures: []
variables:
  q1: {type: decimal, min: 1.0, max: 6.0, step: 0.5, unit: \micro\coulomb, si: 1e-6, label: Charge 1}
  q2: {type: decimal, min: 1.0, max: 8.0, step: 0.5, unit: \micro\coulomb, si: 1e-6, label: Charge 2}
  q3: {type: decimal, min: 1.0, max: 8.0, step: 0.5, unit: \micro\coulomb, si: 1e-6, label: Charge 3}
  a:  {type: integer, min: 10, max: 40, step: 1, unit: cm, si: 0.01, label: Distance entre q1 et q2}
  b:  {type: integer, min: 10, max: 40, step: 1, unit: cm, si: 0.01, label: Distance entre q1 et q3}
constraints: []
solution:
  mode: manual
  parts:
    a1: {expr: "8.99e9*q1*q2/a**2", unit: N, label: Force de q2 sur q1}
    a2: {expr: "8.99e9*q1*q3/b**2", unit: N, label: Force de q3 sur q1}
    b: {expr: "8.99e9*q1*sqrt((q2/a**2)**2 + (q3/b**2)**2)", unit: N, label: Force résultante}
    c: {expr: "deg(atan((q3/b**2)/(q2/a**2)))", unit: \degree, label: "Angle sous l'axe des x négatifs"}
