title: Électron en orbite autour du proton
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  r: {type: choice, values: [52.9, 212, 476, 847], unit: pm, si: 1e-12, label: Rayon de l'orbite}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "8.99e9*(1.602e-19)**2/r**2", unit: N, label: Force électrique}
    b: {expr: "sqrt(8.99e9*(1.602e-19)**2/(9.109e-31*r))", unit: m/s, label: Vitesse de l'électron}
    c: {expr: "2*pi*r/sqrt(8.99e9*(1.602e-19)**2/(9.109e-31*r))", unit: s, label: Période}
