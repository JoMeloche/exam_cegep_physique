title: Force résultante sur une charge alignée
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  q1: {type: decimal, min: 2.0, max: 9.0, step: 0.5, unit: \micro\coulomb, si: 1e-6, label: Charge 1}
  q2: {type: decimal, min: -6.0, max: -1.0, step: 0.5, unit: \micro\coulomb, si: 1e-6, label: Charge 2}
  q3: {type: decimal, min: 1.0, max: 5.0, step: 0.5, unit: \micro\coulomb, si: 1e-6, label: Charge 3}
  d1: {type: integer, min: 10, max: 30, step: 1, unit: cm, si: 0.01, label: Distance entre q1 et q2}
  d2: {type: integer, min: 8, max: 25, step: 1, unit: cm, si: 0.01, label: Distance entre q2 et q3}
constraints:
  - abs(q1/(d1 + d2)**2 + q2/d2**2) > 0.15*abs(q2/d2**2)
solution:
  mode: manual
  parts:
    a: {expr: "8.99e9*q1*q3/(d1 + d2)**2", unit: N, label: "Force de q1 sur q3 (+x)"}
    b: {expr: "8.99e9*q2*q3/d2**2", unit: N, label: "Force de q2 sur q3 (composante x)"}
    c: {expr: "8.99e9*q3*(q1/(d1 + d2)**2 + q2/d2**2)", unit: N, label: "Force résultante sur q3 (composante x)"}
