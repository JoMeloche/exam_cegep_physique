title: Champ sur l'axe d'un anneau chargé
type: developpement
points: 20
time_min: 15
difficulty: 4
figures: []
variables:
  R: {type: integer, min: 3, max: 15, step: 1, unit: cm, si: 0.01, label: Rayon de l'anneau}
  Q: {type: integer, min: 5, max: 80, step: 5, unit: nC, si: 1e-9, label: Charge de l'anneau}
  z: {type: integer, min: 2, max: 30, step: 1, unit: cm, si: 0.01, label: Distance sur l'axe}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "8.99e9*Q*z/(z**2 + R**2)**1.5", unit: N/C, label: Champ sur l'axe}
    b: {expr: "0", unit: N/C, label: Champ au centre}
    c: {expr: "8.99e9*Q*(R/sqrt(2))/(1.5*R**2)**1.5", unit: N/C, label: Champ maximal}
