solution: {mode: none}
answer: C
explanation: 'À l''extérieur, la sphère se comporte comme une charge ponctuelle au centre : $E \propto 1/r^2$, donc doubler $r$ divise le champ par 4.'
choices:
  - '$E$'
  - '$E/2$'
  - '$E/4$'
  - 'Zéro'
