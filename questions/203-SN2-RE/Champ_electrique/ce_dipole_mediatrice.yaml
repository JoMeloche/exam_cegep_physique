title: Champ d'un dipôle sur sa médiatrice
type: developpement
points: 20
time_min: 18
difficulty: 4
figures: []
variables:
  q:  {type: integer, min: 5, max: 50, step: 5, unit: nC, si: 1e-9, label: Charge du dipôle}
  a:  {type: decimal, min: 2.0, max: 8.0, step: 0.5, unit: cm, si: 0.01, label: Demi-distance entre les charges}
  y:  {type: integer, min: 3, max: 15, step: 1, unit: cm, si: 0.01, label: Distance du milieu au point P}
  q0: {type: integer, min: 1, max: 10, step: 1, unit: nC, si: 1e-9, label: Charge placée en P}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "8.99e9*q/(a**2 + y**2)", unit: N/C, label: Champ de chaque charge}
    b: {expr: "2*8.99e9*q*a/(a**2 + y**2)**1.5", unit: N/C, label: Champ résultant}
    c: {expr: "q0*2*8.99e9*q*a/(a**2 + y**2)**1.5", unit: N, label: Force sur la charge q0}
