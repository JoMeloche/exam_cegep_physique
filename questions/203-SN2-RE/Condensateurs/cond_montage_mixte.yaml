title: Condensateurs en série et en parallèle
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  C1: {type: decimal, min: 2.0, max: 12.0, step: 0.5, unit: \micro\farad, si: 1e-6, label: Capacité 1}
  C2: {type: decimal, min: 1.0, max: 8.0, step: 0.5, unit: \micro\farad, si: 1e-6, label: Capacité 2}
  C3: {type: decimal, min: 1.0, max: 8.0, step: 0.5, unit: \micro\farad, si: 1e-6, label: Capacité 3}
  V:  {type: integer, min: 6, max: 60, step: 3, unit: V, label: Tension de la pile}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "C1*(C2 + C3)/(C1 + C2 + C3)", unit: F, label: Capacité équivalente}
    b1: {expr: "V*C1*(C2 + C3)/(C1 + C2 + C3)", unit: C, label: Charge sur C1}
    b2: {expr: "V*(C2 + C3)/(C1 + C2 + C3)", unit: V, label: Tension sur C1}
    c1: {expr: "V*C1/(C1 + C2 + C3)", unit: V, label: Tension sur C2}
    c2: {expr: "C2*V*C1/(C1 + C2 + C3)", unit: C, label: Charge sur C2}
