title: Trois condensateurs en série
type: developpement
points: 20
time_min: 12
difficulty: 2
figures: []
variables:
  C1: {type: decimal, min: 1.0, max: 10.0, step: 0.5, unit: \micro\farad, si: 1e-6, label: Capacité 1}
  C2: {type: decimal, min: 1.0, max: 10.0, step: 0.5, unit: \micro\farad, si: 1e-6, label: Capacité 2}
  C3: {type: decimal, min: 1.0, max: 10.0, step: 0.5, unit: \micro\farad, si: 1e-6, label: Capacité 3}
  V:  {type: integer, min: 6, max: 120, step: 3, unit: V, label: Tension de la pile}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "1/(1/C1 + 1/C2 + 1/C3)", unit: F, label: Capacité équivalente}
    b: {expr: "V/(1/C1 + 1/C2 + 1/C3)", unit: C, label: Charge sur chaque condensateur}
    c1: {expr: "V/(1/C1 + 1/C2 + 1/C3)/C1", unit: V, label: Tension sur C1}
    c2: {expr: "V/(1/C1 + 1/C2 + 1/C3)/C2", unit: V, label: Tension sur C2}
    c3: {expr: "V/(1/C1 + 1/C2 + 1/C3)/C3", unit: V, label: Tension sur C3}
