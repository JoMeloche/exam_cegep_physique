title: Inductance et énergie d'un solénoïde
type: developpement
points: 20
time_min: 13
difficulty: 3
figures: []
variables:
  l: {type: integer, min: 10, max: 50, step: 5, unit: cm, si: 0.01, label: Longueur du solénoïde}
  r: {type: decimal, min: 0.5, max: 3.0, step: 0.5, unit: cm, si: 0.01, label: Rayon du solénoïde}
  N: {type: integer, min: 200, max: 2000, step: 100, unit: '', label: Nombre de spires}
  dIdt: {type: integer, min: 10, max: 500, step: 10, unit: A/s, label: Taux de diminution du courant}
  I: {type: decimal, min: 0.5, max: 10.0, step: 0.5, unit: A, label: Courant}
constraints:
  - l > 5*r
  - 4*pi*1e-7*N**2*pi*r**2/l*dIdt <= 20
  - 4*pi*1e-7*N**2*pi*r**2/l*dIdt >= 0.01
solution:
  mode: manual
  parts:
    a: {expr: "4*pi*1e-7*N**2*pi*r**2/l", unit: H, label: Inductance}
    b: {expr: "4*pi*1e-7*N**2*pi*r**2/l*dIdt", unit: V, label: Force électromotrice auto-induite}
    c: {expr: "0.5*4*pi*1e-7*N**2*pi*r**2/l*I**2", unit: J, label: Énergie emmagasinée}
