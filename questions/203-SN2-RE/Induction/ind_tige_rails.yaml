title: Tige qui glisse sur des rails dans un champ magnétique
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  L: {type: integer, min: 10, max: 100, step: 5, unit: cm, si: 0.01, label: Longueur de la tige}
  v: {type: decimal, min: 0.5, max: 10.0, step: 0.5, unit: m/s, label: Vitesse de la tige}
  R: {type: decimal, min: 0.5, max: 20.0, step: 0.5, unit: \ohm, label: Résistance}
  B: {type: decimal, min: 0.10, max: 1.50, step: 0.05, unit: T, label: Champ magnétique}
constraints:
  - B*L*v/R >= 0.05
  - B*L*v/R <= 10
solution:
  mode: manual
  parts:
    a: {expr: "B*L*v", unit: V, label: Force électromotrice induite}
    b: {expr: "B*L*v/R", unit: A, label: Courant induit}
    c: {expr: "B**2*L**2*v/R", unit: N, label: Force à appliquer}
    d: {expr: "(B*L*v)**2/R", unit: W, label: Puissance dissipée}
