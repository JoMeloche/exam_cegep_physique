title: Bobine dans un champ magnétique variable (loi de Faraday)
type: developpement
points: 20
time_min: 14
difficulty: 2
figures: []
variables:
  N: {type: integer, min: 10, max: 500, step: 10, unit: '', label: Nombre de spires}
  r: {type: decimal, min: 1.0, max: 10.0, step: 0.5, unit: cm, si: 0.01, label: Rayon de la bobine}
  R: {type: decimal, min: 0.5, max: 20.0, step: 0.5, unit: \ohm, label: Résistance de la bobine}
  B1: {type: integer, min: 0, max: 500, step: 10, unit: mT, si: 0.001, label: Champ initial}
  B2: {type: integer, min: 0, max: 500, step: 10, unit: mT, si: 0.001, label: Champ final}
  dt: {type: integer, min: 10, max: 500, step: 10, unit: ms, si: 0.001, label: Durée de la variation}
constraints:
  - abs(B2 - B1) >= 0.05
  - N*abs(B2 - B1)*pi*r**2/dt <= 30
  - N*abs(B2 - B1)*pi*r**2/dt >= 0.05
  - N*abs(B2 - B1)*pi*r**2/dt/R <= 5
solution:
  mode: manual
  parts:
    a: {expr: "(B2 - B1)*pi*r**2", unit: Wb, label: Variation du flux par spire}
    b: {expr: "N*abs(B2 - B1)*pi*r**2/dt", unit: V, label: Force électromotrice induite}
    c: {expr: "N*abs(B2 - B1)*pi*r**2/dt/R", unit: A, label: Courant induit}
    d: {expr: "N*abs(B2 - B1)*pi*r**2/R", unit: C, label: Charge totale}
