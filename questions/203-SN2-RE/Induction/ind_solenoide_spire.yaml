title: Spire entourant un solénoïde dont le courant varie
type: developpement
points: 20
time_min: 13
difficulty: 4
figures: []
variables:
  rs: {type: decimal, min: 1.0, max: 5.0, step: 0.5, unit: cm, si: 0.01, label: Rayon du solénoïde}
  rl: {type: decimal, min: 2.0, max: 15.0, step: 0.5, unit: cm, si: 0.01, label: Rayon de la spire}
  n: {type: integer, min: 500, max: 5000, step: 100, unit: m^-1, label: Spires par mètre}
  dIdt: {type: integer, min: 5, max: 200, step: 5, unit: A/s, label: Taux de variation du courant}
  R: {type: decimal, min: 0.01, max: 0.50, step: 0.01, unit: \ohm, label: Résistance de la spire}
constraints:
  - rl > rs + 0.005
  - pi*rs**2*4*pi*1e-7*n*dIdt/R >= 0.001
  - pi*rs**2*4*pi*1e-7*n*dIdt/R <= 2
solution:
  mode: manual
  parts:
    a: {expr: "4*pi*1e-7*n*dIdt", unit: T/s, label: Taux de variation du champ}
    b: {expr: "pi*rs**2*4*pi*1e-7*n*dIdt", unit: V, label: Force électromotrice induite}
    c: {expr: "pi*rs**2*4*pi*1e-7*n*dIdt/R", unit: A, label: Courant induit}
