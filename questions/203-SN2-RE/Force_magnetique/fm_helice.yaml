title: Trajectoire en hélice d'un électron
type: developpement
points: 20
time_min: 14
difficulty: 3
figures: []
variables:
  v: {type: decimal, min: 1.0, max: 9.0, step: 0.1, unit: m/s, si: 1e6, label: "Vitesse de l'électron (en 10^6 m/s)"}
  B: {type: decimal, min: 0.5, max: 20.0, step: 0.5, unit: mT, si: 0.001, label: Champ magnétique}
  th: {type: integer, min: 15, max: 75, step: 5, unit: \degree, label: Angle entre la vitesse et le champ}
constraints: []
solution:
  mode: manual
  parts:
    a1: {expr: "v*cos(rad(th))", unit: m/s, label: Vitesse parallèle}
    a2: {expr: "v*sin(rad(th))", unit: m/s, label: Vitesse perpendiculaire}
    b: {expr: "9.109e-31*v*sin(rad(th))/(1.602e-19*B)", unit: m, label: Rayon de l'hélice}
    c: {expr: "2*pi*9.109e-31*v*cos(rad(th))/(1.602e-19*B)", unit: m, label: Pas de l'hélice}
