solution: {mode: none}
answer: C
explanation: 'La force magnétique est toujours perpendiculaire à la vitesse : elle ne fait aucun travail. L''énergie cinétique, donc la grandeur de la vitesse, reste constante ; seule la direction change.'
choices:
  - Elle augmente
  - Elle diminue
  - Elle reste constante
  - Elle oscille entre deux valeurs
