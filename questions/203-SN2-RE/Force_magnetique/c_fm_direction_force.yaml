solution: {mode: none}
answer: C
explanation: '$\vec{F} = q\,\vec{v}\times\vec{B}$ avec $q > 0$ : $\vec{\imath}\times\vec{\jmath} = \vec{k}$, donc la force est orientée selon $+z$.'
choices:
  - $-z$
  - $+y$
  - $+z$
  - $-x$
