title: Ressort vertical étiré par une masse
type: developpement
points: 20
time_min: 18
difficulty: 3
figures: []
variables:
  m: {type: integer, min: 100, max: 500, step: 50, unit: g, si: 0.001, label: Masse suspendue}
  dx: {type: decimal, min: 2.0, max: 10.0, step: 0.5, unit: cm, si: 0.01, label: Allongement à l'équilibre}
  A: {type: decimal, min: 1.0, max: 5.0, step: 0.5, unit: cm, si: 0.01, label: Amplitude}
constraints:
  - A < dx
solution:
  mode: manual
  file: mhs_ressort_vertical.sol.tex
  parts:
    a: {expr: "m*g/dx", unit: N/m, label: Constante de rappel}
    b: {expr: "2*pi*sqrt(dx/g)", unit: s, label: Période}
    c: {expr: "2*pi*sqrt(dx/g)/3", unit: s, label: Temps pour atteindre A/2 au-dessus}
    d: {expr: "A*sqrt(g/dx)", unit: m/s, label: Vitesse maximale}
