title: Mesurer la masse d'un haltère (Lune)
type: developpement
points: 20
time_min: 20
difficulty: 3
figures: []
variables:
  Raideur:
    type: integer
    min: 30
    max: 60
    step: 5
    unit: N/m
    label: Constante de rappel
  Etirement:
    type: integer
    min: 30
    max: 55
    step: 5
    unit: cm
    label: Étirement initial
    si: 0.01
  TempsPassage:
    type: decimal
    min: 0.29
    max: 0.47
    step: 0.01
    unit: s
    label: Instant du premier passage
  PosEval:
    type: decimal
    min: 0.1
    max: 0.3
    step: 0.05
    unit: m
    label: Position évaluée
constraints:
- PosEval < 0.9*Etirement
solution:
  mode: answers_only
  parts:
    a:
      expr: 4*TempsPassage
      unit: s
      label: Période
    b:
      expr: Raideur*(4*TempsPassage)**2/(4*pi**2)
      unit: kg
      label: Masse
    c:
      expr: Raideur*Etirement**2/2
      unit: J
      label: Énergie mécanique
    d:
      expr: 2*pi/(4*TempsPassage)*sqrt(Etirement**2 - PosEval**2)
      unit: m/s
      label: Vitesse à x
source: Question_dev/MHS/q_mass-ressort_lune.tex
