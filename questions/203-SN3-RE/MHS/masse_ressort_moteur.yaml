answer: C
explanation: 'Résonance : l''amplitude est maximale quand la fréquence d''excitation égale la fréquence naturelle (\qty{2}{Hz}).'
choices:
- Si le moteur applique une force très intense
- Si le moteur applique une force faible mais constante
- Si le moteur vibre à une fréquence de $2\text{ Hz}$
- Si le moteur vibre à une fréquence très supérieure à $2\text{ Hz}$
- Si le moteur vibre à une fréquence très inférieure à $2\text{ Hz}$
