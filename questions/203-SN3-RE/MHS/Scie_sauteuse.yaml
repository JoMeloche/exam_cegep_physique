title: Lame de scie sauteuse en MHS
type: developpement
points: 20
time_min: 20
difficulty: 3
figures:
- scie-sauteuse.png
variables:
  Freq:
    type: integer
    min: 40
    max: 65
    step: 5
    label: Fréquence
    unit: Hz
  Course:
    type: integer
    min: 4
    max: 9
    step: 1
    label: Course de la lame
    unit: cm
    si: 0.01
  Depassement:
    type: decimal
    min: 1
    max: 3.5
    step: 0.5
    label: Dépassement sous la planche
    unit: cm
    si: 0.01
constraints:
- Depassement < Course
solution:
  mode: answers_only
  parts:
    a:
      expr: Course/2
      unit: m
      label: Amplitude
    b:
      expr: 1000*2*acos(1 - 2*Depassement/Course)/(2*pi*Freq)
      unit: ms
      label: Durée du dépassement par cycle
