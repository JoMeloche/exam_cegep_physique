title: Analyse d'une équation de position sinusoïdale
type: developpement
points: 20
time_min: 18
difficulty: 3
figures: []
variables:
  A:   {type: integer, min: 3, max: 15, step: 1, unit: cm, si: 0.01, label: Amplitude}
  w:   {type: decimal, min: 2.0, max: 12.0, step: 0.5, unit: rad/s, label: Fréquence angulaire}
  phi: {type: decimal, min: 0.3, max: 1.2, step: 0.1, unit: rad, label: Constante de phase}
  m:   {type: decimal, min: 0.1, max: 1.0, step: 0.1, unit: kg, label: Masse}
constraints: []
solution:
  mode: manual
  file: mhs_equation_sinus.sol.tex
  parts:
    a1: {expr: "w/(2*pi)", unit: Hz, label: Fréquence}
    a2: {expr: "2*pi/w", unit: s, label: Période}
    b1: {expr: "A*sin(phi)", unit: m, label: Position initiale}
    b2: {expr: "A*w*cos(phi)", unit: m/s, label: Vitesse initiale}
    c1: {expr: "m*w**2", unit: N/m, label: Constante de rappel}
    c2: {expr: "m*w**2*A**2/2", unit: J, label: Énergie mécanique}
