title: 'Pendule simple : amplitude et énergie'
type: developpement
points: 20
time_min: 20
difficulty: 3
figures: []
variables:
  Masse:
    type: integer
    min: 30
    max: 55
    step: 5
    label: Masse
    unit: g
    si: 0.001
  Longueur:
    type: integer
    min: 70
    max: 105
    step: 5
    label: Longueur du fil
    unit: cm
    si: 0.01
  Angle:
    type: decimal
    min: 7.2
    max: 10.3
    step: 0.1
    label: Angle initial
    unit: \degree
  Vit:
    type: decimal
    min: 0.4
    max: 0.8
    step: 0.1
    label: Vitesse tangentielle initiale
    unit: m/s
solution:
  mode: answers_only
  parts:
    a:
      expr: sqrt((Longueur*rad(Angle))**2 + Vit**2*Longueur/g)
      unit: m
      label: Amplitude (arc)
    b:
      expr: Masse*g/Longueur*((Longueur*rad(Angle))**2 + Vit**2*Longueur/g)/2
      unit: J
      label: Énergie mécanique
    c:
      expr: sqrt(g/Longueur)*sqrt((Longueur*rad(Angle))**2 + Vit**2*Longueur/g)
      unit: m/s
      label: Vitesse maximale
