title: Comparer deux métaux éclairés par la même lumière
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  lam:  {type: integer, min: 180, max: 320, step: 10, unit: nm, si: 1e-9, label: Longueur d'onde}
  phi1: {type: choice, values: [2.28, 2.36, 2.75], unit: eV, label: Travail d'extraction du métal 1}
  phi2: {type: choice, values: [4.08, 4.26, 4.70, 5.10], unit: eV, label: Travail d'extraction du métal 2}
constraints:
  - 1240/(lam*1e9) > phi2 + 0.2
solution:
  mode: manual
  parts:
    a1: {expr: "1240/(lam*1e9) - phi1", unit: V, label: Potentiel d'arrêt du métal 1}
    a2: {expr: "1240/(lam*1e9) - phi2", unit: V, label: Potentiel d'arrêt du métal 2}
    b: {expr: "1240/phi2*1e-9", unit: m, label: Longueur d'onde maximale pour le métal 2}
