title: Fréquence et longueur d'onde de seuil d'un métal
type: developpement
points: 20
time_min: 12
difficulty: 2
figures: []
variables:
  phi: {type: choice, values: [2.28, 2.36, 2.75, 3.66, 4.08, 4.26, 4.70, 5.10], unit: eV, label: Travail d'extraction}
  lam: {type: integer, min: 200, max: 650, step: 10, unit: nm, si: 1e-9, label: Longueur d'onde testée}
constraints:
  - abs(1240/phi - lam*1e9) > 20
solution:
  mode: manual
  parts:
    a: {expr: "phi*1.602e-19/6.626e-34", unit: Hz, label: Fréquence de seuil}
    b: {expr: "1240/phi*1e-9", unit: m, label: Longueur d'onde de seuil}
