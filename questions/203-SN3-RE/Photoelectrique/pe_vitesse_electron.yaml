title: Vitesse maximale des photoélectrons
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  lam: {type: integer, min: 120, max: 350, step: 10, unit: nm, si: 1e-9, label: Longueur d'onde}
  phi: {type: choice, values: [2.28, 2.75, 3.66, 4.26, 4.70], unit: eV, label: Travail d'extraction}
constraints:
  - 1240/(lam*1e9) > phi + 0.3
solution:
  mode: manual
  parts:
    a: {expr: "(1240/(lam*1e9) - phi)*1.602e-19", unit: J, label: Énergie cinétique maximale}
    b: {expr: "sqrt(2*(1240/(lam*1e9) - phi)*1.602e-19/9.109e-31)", unit: m/s, label: Vitesse maximale}
    c: {expr: "6.626e-34/sqrt(2*9.109e-31*(1240/(lam*1e9) - phi)*1.602e-19)", unit: m, label: Longueur d'onde de de Broglie}
