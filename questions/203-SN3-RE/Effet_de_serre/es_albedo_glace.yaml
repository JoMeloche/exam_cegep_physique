title: Effet de la fonte des glaces sur la température d'équilibre
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  a1: {type: decimal, min: 0.30, max: 0.34, step: 0.01, label: Albédo initial}
  da: {type: decimal, min: 0.01, max: 0.05, step: 0.005, label: Baisse d'albédo}
constraints: []
solution:
  mode: manual
  parts:
    e1: {expr: "(1361*(1 - a1)/(4*5.67e-8))**0.25", unit: K, label: Température initiale}
    e2: {expr: "(1361*(1 - a1 + da)/(4*5.67e-8))**0.25", unit: K, label: Température finale}
    e3: {expr: "(1361*(1 - a1 + da)/(4*5.67e-8))**0.25 - (1361*(1 - a1)/(4*5.67e-8))**0.25", unit: K, label: Hausse}
