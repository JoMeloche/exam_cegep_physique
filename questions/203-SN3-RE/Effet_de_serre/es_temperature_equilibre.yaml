title: Température d'équilibre de la Terre sans effet de serre
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  S:  {type: integer, min: 1340, max: 1380, step: 5, unit: W/m^2, label: Constante solaire}
  al: {type: decimal, min: 0.25, max: 0.35, step: 0.01, label: Albédo}
constraints: []
solution:
  mode: manual
  parts:
    e1: {expr: "S*(1 - al)/4", unit: W/m^2, label: Puissance absorbée par unité de surface}
    e2: {expr: "(S*(1 - al)/(4*5.67e-8))**0.25", unit: K, label: Température d'équilibre}
    e3: {expr: "288 - (S*(1 - al)/(4*5.67e-8))**0.25", unit: K, label: Écart avec 288 K}
