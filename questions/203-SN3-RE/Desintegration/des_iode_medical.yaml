title: Iode 131 en médecine nucléaire
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  m0: {type: decimal, min: 0.2, max: 2.0, step: 0.1, unit: \micro\gram, si: 1e-9, label: Masse initiale}
  t:  {type: integer, min: 2, max: 40, step: 1, unit: d, label: Durée (jours)}
  p:  {type: choice, values: [1, 2, 5, 10], unit: \percent, label: Pourcentage visé}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "m0*0.5**(t/8.02)", unit: kg, label: Masse restante}
    b: {expr: "log(2)/(8.02*86400)*m0/0.131*6.022e23", unit: Bq, label: Activité initiale}
    c: {expr: "8.02*log(100/p)/log(2)", unit: d, label: Durée pour atteindre p %}
