title: Constante de désintégration, activité et noyaux restants
type: developpement
points: 20
time_min: 15
difficulty: 2
figures: []
variables:
  N0: {type: sigfig, min: 1.0e12, max: 9.9e15, sigfigs: 2, label: Nombre initial de noyaux}
  T:  {type: decimal, min: 2.0, max: 60.0, step: 0.5, unit: h, si: 3600, label: Demi-vie}
  t:  {type: decimal, min: 1.0, max: 100.0, step: 0.5, unit: h, si: 3600, label: Durée écoulée}
constraints:
  - 0.3 <= t/T <= 6   # between 1.5 % and 80 % of the nuclei remain
solution:
  mode: manual
  parts:
    a: {expr: "log(2)/T", unit: 1/s, label: Constante de désintégration}
    b: {expr: "log(2)/T*N0", unit: Bq, label: Activité initiale}
    c: {expr: "N0*exp(-log(2)/T*t)", unit: "", label: Noyaux restants}
