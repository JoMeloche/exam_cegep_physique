title: Radon dans un sous-sol
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  C:  {type: integer, min: 250, max: 2000, step: 50, unit: Bq/m^3, label: Concentration d'activité}
  V:  {type: integer, min: 50, max: 400, step: 10, unit: m^3, label: Volume du sous-sol}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "C*V", unit: Bq, label: Activité totale}
    b: {expr: "C*V/(log(2)/(3.82*86400))", unit: "", label: Nombre d'atomes de radon}
    c: {expr: "3.82*log(C/200)/log(2)", unit: d, label: Durée pour descendre sous 200 Bq/m3}
