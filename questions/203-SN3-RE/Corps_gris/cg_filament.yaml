title: Filament d'une ampoule à incandescence
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  P: {type: choice, values: [25, 40, 60, 75, 100], unit: W, label: Puissance de l'ampoule}
  T: {type: integer, min: 2500, max: 3200, step: 50, unit: K, label: Température du filament}
  em: {type: decimal, min: 0.30, max: 0.45, step: 0.01, label: Émissivité du tungstène}
constraints: []
solution:
  mode: manual
  parts:
    e1: {expr: "P/(em*5.67e-8*T**4)", unit: m^2, label: Aire du filament}
    e2: {expr: "2.898e-3/T", unit: m, label: Lambda max}
