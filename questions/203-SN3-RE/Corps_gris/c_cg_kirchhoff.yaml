answer: B
explanation: 'Selon la loi de Kirchhoff, l''absorptivité égale l''émissivité : une surface sombre et mate qui absorbe bien rayonne aussi bien.'
choices:
  - 'La plaque polie'
  - 'La plaque noire mate'
  - 'Elles rayonnent la même puissance, car elles sont à la même température'
  - 'Aucune des deux ne rayonne, car elles sont en équilibre'
