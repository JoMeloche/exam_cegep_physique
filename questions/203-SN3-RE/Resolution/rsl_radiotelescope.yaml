title: Résolution d'un radiotélescope
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  Dm: {type: integer, min: 25, max: 300, step: 5, unit: m, label: Diamètre de l'antenne}
  lamr: {type: choice, values: [21, 6, 3.5], unit: cm, si: 0.01, label: Longueur d'onde observée}
constraints: []
solution:
  mode: manual
  parts:
    th: {expr: "deg(1.22*lamr/Dm)", unit: deg, label: Angle limite de résolution}
    sg: {expr: "1.22*lamr/Dm*2.4e22", unit: m, label: Plus petit détail dans Andromède}
    Dopt: {expr: "Dm*550e-9/lamr", unit: m, label: Diamètre d'un télescope optique équivalent}
