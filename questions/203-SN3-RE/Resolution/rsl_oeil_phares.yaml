title: Distinguer les deux phares d'une voiture
type: developpement
points: 20
time_min: 15
difficulty: 2
figures: []
variables:
  ec: {type: decimal, min: 1.2, max: 1.8, step: 0.1, unit: m, label: Distance entre les phares}
  Dp1: {type: decimal, min: 2.0, max: 4.0, step: 0.5, unit: mm, si: 0.001, label: Diamètre de la pupille le jour}
  Dp2: {type: decimal, min: 5.0, max: 8.0, step: 0.5, unit: mm, si: 0.001, label: Diamètre de la pupille la nuit}
  lam: {type: integer, min: 500, max: 600, step: 10, unit: nm, si: 1e-9, label: Longueur d'onde}
constraints: []
solution:
  mode: manual
  parts:
    th: {expr: "1.22*lam/Dp1", unit: rad, label: Angle limite de résolution (jour)}
    L1: {expr: "ec*Dp1/(1.22*lam)", unit: m, label: Distance maximale (jour)}
    L2: {expr: "ec*Dp2/(1.22*lam)", unit: m, label: Distance maximale (nuit)}
