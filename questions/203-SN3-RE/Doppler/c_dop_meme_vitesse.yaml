solution: {mode: none}
answer: D
explanation: 'S''ils se déplacent ensemble dans de l''air immobile, les facteurs $(v+u)$ au numérateur et $(v+u)$ au dénominateur se compensent : aucune variation de fréquence.'
choices:
  - 'Plus élevée que la fréquence jouée'
  - 'Plus basse que la fréquence jouée'
  - 'Impossible à déterminer sans la vitesse du son'
  - 'Égale à la fréquence jouée'
