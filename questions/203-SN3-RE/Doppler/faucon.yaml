title: Faucon en trottinette et robot-aspirateur
type: developpement
points: 20
time_min: 20
difficulty: 3
figures: []
variables:
  FauconVitesse:
    type: decimal
    min: 9.9
    max: 13.1
    step: 0.1
    unit: m/s
    label: Vitesse du faucon
  CibleVitesse:
    type: integer
    min: 6
    max: 10
    step: 1
    unit: m/s
    label: Vitesse du robot-aspirateur
  OiseauFreq:
    type: integer
    min: 1540
    max: 2260
    step: 10
    unit: Hz
    label: Fréquence du cri
  DopplerVson:
    type: integer
    min: 334
    max: 347
    step: 1
    unit: m/s
    label: Vitesse du son
solution:
  mode: manual
  file: faucon.sol.tex
  parts:
    a:
      expr: OiseauFreq*DopplerVson/(DopplerVson - FauconVitesse)
      unit: Hz
      label: Son direct
    b:
      expr: OiseauFreq*(DopplerVson - CibleVitesse)/(DopplerVson - FauconVitesse)*DopplerVson/(DopplerVson + CibleVitesse)
      unit: Hz
      label: Écho
    c:
      expr: OiseauFreq*DopplerVson/(DopplerVson - FauconVitesse) - OiseauFreq*(DopplerVson - CibleVitesse)/(DopplerVson - FauconVitesse)*DopplerVson/(DopplerVson + CibleVitesse)
      unit: Hz
      label: Fréquence des battements
