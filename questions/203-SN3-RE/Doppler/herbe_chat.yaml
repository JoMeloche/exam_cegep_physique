title: Chat et vélociraptor (écho et battements)
type: developpement
points: 20
time_min: 20
difficulty: 3
figures: []
variables:
  Vr:
    type: integer
    min: 6
    max: 14
    step: 2
    unit: m/s
    label: Vitesse du vélociraptor
  Vc:
    type: decimal
    min: 8.3
    max: 13.5
    step: 0.1
    unit: m/s
    label: Vitesse du chat
  Freq:
    type: integer
    min: 1730
    max: 2570
    step: 10
    unit: Hz
    label: Fréquence du miaulement
  Vson:
    type: integer
    min: 336
    max: 347
    step: 1
    unit: m/s
    label: Vitesse du son
constraints:
- abs(Vc - Vr) >= 1
solution:
  mode: answers_only
  parts:
    a:
      expr: Freq*(Vson - Vr)/(Vson - Vc)*(Vson + Vc)/(Vson + Vr)
      unit: Hz
      label: Fréquence de l'écho (4 chiffres significatifs)
      sigfigs: 4
    b:
      expr: abs(Freq*(Vson - Vr)/(Vson - Vc)*(Vson + Vc)/(Vson + Vr) - Freq)
      unit: Hz
      label: Fréquence des battements
source: Question_dev/Doppler/Q_herbe_chat.tex
