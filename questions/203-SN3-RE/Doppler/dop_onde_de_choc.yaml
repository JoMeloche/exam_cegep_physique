title: Onde de choc d'un avion supersonique
type: developpement
points: 20
time_min: 15
difficulty: 4
figures: []
variables:
  M: {type: decimal, min: 1.2, max: 3.0, step: 0.1, label: Nombre de Mach}
  h: {type: decimal, min: 3.0, max: 15.0, step: 0.5, unit: km, si: 1000, label: Altitude}
  v: {type: choice, values: [300, 320, 340], unit: m/s, label: Vitesse du son}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "M*v", unit: m/s, label: Vitesse de l'avion}
    b: {expr: "deg(asin(1/M))", unit: deg, label: Demi-angle du cône}
    c: {expr: "h/tan(asin(1/M))/(M*v)", unit: s, label: Délai du bang}
