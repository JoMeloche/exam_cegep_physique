title: Voiture de police et camion (écho)
type: developpement
points: 20
time_min: 20
difficulty: 3
figures: []
variables:
  VPolice:
    type: integer
    min: 25
    max: 45
    step: 5
    label: Vitesse de la voiture de police
    unit: m/s
  Freq:
    type: integer
    min: 540
    max: 660
    step: 10
    label: Fréquence de la sirène
    unit: Hz
  VCamion:
    type: integer
    min: 5
    max: 25
    step: 5
    label: Vitesse du camion
    unit: m/s
  VSon:
    type: choice
    values:
    - 343
    label: Vitesse du son
    unit: m/s
constraints:
- VPolice > VCamion
solution:
  mode: answers_only
  parts:
    a:
      expr: Freq*(VSon - VCamion)/(VSon - VPolice)
      unit: Hz
      label: Fréquence perçue par le camion
    b:
      expr: Freq*(VSon - VCamion)/(VSon - VPolice)*(VSon + VPolice)/(VSon + VCamion)
      unit: Hz
      label: Fréquence réfléchie perçue par la police
