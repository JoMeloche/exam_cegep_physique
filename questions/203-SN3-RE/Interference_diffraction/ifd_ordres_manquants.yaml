title: Ordres manquants dans une figure à deux fentes
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  lam: {type: integer, min: 450, max: 680, step: 10, unit: nm, si: 1e-9, label: Longueur d'onde}
  larg: {type: integer, min: 20, max: 80, step: 5, unit: \micro\metre, si: 1e-6, label: Largeur de chaque fente}
  k: {type: integer, min: 2, max: 5, label: Rapport entre la distance entre les fentes et leur largeur}
  L: {type: decimal, min: 1.0, max: 3.0, step: 0.1, unit: m, label: Distance fentes-écran}
constraints: []
solution:
  mode: manual
  parts:
    dd: {expr: "k*larg", unit: m, label: Distance entre les fentes}
    mm: {expr: "k", unit: "", label: Premier ordre manquant}
    nf: {expr: "2*k - 1", unit: "", label: Nombre de franges brillantes dans le maximum central}
    ym: {expr: "lam*L/larg", unit: m, label: Position du premier ordre manquant}
