title: Intensité d'une figure à deux fentes de largeur non nulle
type: developpement
points: 20
time_min: 20
difficulty: 5
figures: []
variables:
  lam: {type: integer, min: 450, max: 680, step: 10, unit: nm, si: 1e-9, label: Longueur d'onde}
  sep: {type: integer, min: 150, max: 500, step: 10, unit: \micro\metre, si: 1e-6, label: Distance entre les fentes}
  larg: {type: integer, min: 30, max: 100, step: 5, unit: \micro\metre, si: 1e-6, label: Largeur de chaque fente}
  L: {type: decimal, min: 1.0, max: 2.5, step: 0.1, unit: m, label: Distance fentes-écran}
  y: {type: decimal, min: 0.5, max: 15.0, step: 0.1, unit: mm, si: 0.001, label: Position du point sur l'écran}
  I0: {type: decimal, min: 2.0, max: 9.0, step: 0.5, unit: W/m^2, label: Intensité au centre}
constraints:
  - sep/larg > 1.5
  - cos(pi*sep*y/(lam*L))**2 > 0.15
  - 0.3 < pi*larg*y/(lam*L) < 0.9*pi
solution:
  mode: manual
  parts:
    Fi: {expr: "cos(pi*sep*y/(lam*L))**2", unit: "", label: Facteur d'interférence}
    Fd: {expr: "(sin(pi*larg*y/(lam*L))/(pi*larg*y/(lam*L)))**2", unit: "", label: Facteur de diffraction}
    I: {expr: "I0*cos(pi*sep*y/(lam*L))**2*(sin(pi*larg*y/(lam*L))/(pi*larg*y/(lam*L)))**2", unit: W/m^2, label: Intensité au point P}
