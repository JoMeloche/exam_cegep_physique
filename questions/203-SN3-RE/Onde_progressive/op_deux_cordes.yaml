title: Impulsion traversant deux cordes jointes
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  F:   {type: integer, min: 50, max: 300, step: 10, unit: N, label: Tension}
  mu1: {type: decimal, min: 1.0, max: 5.0, step: 0.5, unit: g/m, si: 0.001, label: Masse linéique de la corde 1}
  mu2: {type: integer, min: 6, max: 20, step: 1, unit: g/m, si: 0.001, label: Masse linéique de la corde 2}
  L1:  {type: decimal, min: 1.0, max: 3.0, step: 0.1, unit: m, label: Longueur de la corde 1}
  L2:  {type: decimal, min: 1.0, max: 3.0, step: 0.1, unit: m, label: Longueur de la corde 2}
constraints: []
solution:
  mode: manual
  parts:
    a1: {expr: "sqrt(F/mu1)", unit: m/s, label: Vitesse dans la corde 1}
    a2: {expr: "sqrt(F/mu2)", unit: m/s, label: Vitesse dans la corde 2}
    b: {expr: "L1/sqrt(F/mu1) + L2/sqrt(F/mu2)", unit: s, label: Temps total}
