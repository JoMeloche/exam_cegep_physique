title: Onde entretenue sur une corde et changement de tension
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  F:  {type: integer, min: 20, max: 200, step: 5, unit: N, label: Tension}
  mu: {type: decimal, min: 1.0, max: 10.0, step: 0.5, unit: g/m, si: 0.001, label: Masse linéique}
  f:  {type: integer, min: 20, max: 200, step: 5, unit: Hz, label: Fréquence du vibreur}
  n:  {type: choice, values: [1.5, 2, 2.5], label: Facteur de longueur d'onde}
constraints:
  - n**2*F <= 400
solution:
  mode: manual
  parts:
    a: {expr: "sqrt(F/mu)", unit: m/s, label: Vitesse}
    b: {expr: "sqrt(F/mu)/f", unit: m, label: Longueur d'onde}
    c: {expr: "n**2*F", unit: N, label: Nouvelle tension}
