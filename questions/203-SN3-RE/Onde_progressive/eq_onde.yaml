solution:
  mode: none
choices:
- Tracez un graphique qui représente le déplacement de la corde en fonction de la position au temps $t = \v{Teval}\text{ s}$. Votre graphique devrait contenir au moins deux cycles de l'onde. Sur votre graphique, indiquez les positions pour lesquelles le déplacement est nul. N'oubliez pas de bien indiquer les unités et la graduation de vos axes !
- Tracez un graphique qui représente le déplacement de la corde en fonction du temps pour un point situé à $x = \v{Xeval}\text{ m}$. Votre graphique devrait contenir au moins deux cycles d'oscillation. Sur votre graphique, indiquez les temps pour lesquels le déplacement est nul. N'oubliez pas de bien indiquer les unités et la graduation de vos axes !
