title: Vitesse d'une impulsion sur une corde tendue
type: developpement
points: 20
time_min: 12
difficulty: 2
figures: []
variables:
  L: {type: decimal, min: 1.0, max: 5.0, step: 0.1, unit: m, label: Longueur de la corde}
  m: {type: integer, min: 5, max: 50, step: 1, unit: g, si: 0.001, label: Masse de la corde}
  F: {type: integer, min: 20, max: 200, step: 5, unit: N, label: Tension}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "m/L", unit: kg/m, label: Masse linéique}
    b: {expr: "sqrt(F*L/m)", unit: m/s, label: Vitesse}
    c: {expr: "L/sqrt(F*L/m)", unit: s, label: Temps de parcours}
