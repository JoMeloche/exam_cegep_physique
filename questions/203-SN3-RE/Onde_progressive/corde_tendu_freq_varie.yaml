title: Changer la fréquence d'une onde sur une corde
type: conceptuel
points: 4
time_min: 4
difficulty: 2
figures: []
solution:
  mode: none
answer: C
explanation: $\omega = 2\pi f$ change et, comme $v$ est fixée par la corde, $k = \omega/v$ change aussi. L'amplitude est indépendante.
choices:
- $k$ seulement
- $\omega$ seulement
- $k$ et $\omega$
- $k$, $\omega$ et $A$
- $\omega$ et $A$
