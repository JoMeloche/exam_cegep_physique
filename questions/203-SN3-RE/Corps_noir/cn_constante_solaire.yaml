title: Luminosité du Soleil et intensité reçue par une planète
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  T:  {type: integer, min: 5700, max: 5850, step: 10, unit: K, label: Température de surface du Soleil}
  dp: {type: choice, values: [0.387, 0.723, 1.000, 1.524, 5.203], unit: UA, si: 1.496e11, label: Distance de la planète}
constraints: []
solution:
  mode: manual
  parts:
    e1: {expr: "5.67e-8*T**4*4*pi*6.96e8**2", unit: W, label: Luminosité du Soleil}
    e2: {expr: "5.67e-8*T**4*4*pi*6.96e8**2/(4*pi*dp**2)", unit: W/m^2, label: Intensité à la planète}
    e3: {expr: "2.898e-3/T", unit: m, label: Longueur d'onde du maximum}
