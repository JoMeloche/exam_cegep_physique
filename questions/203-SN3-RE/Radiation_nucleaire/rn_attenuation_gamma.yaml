title: Atténuation d'un faisceau gamma par un blindage
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  mu: {type: decimal, min: 0.40, max: 1.50, step: 0.05, unit: "cm^{-1}", label: Coefficient d'atténuation}
  x:  {type: decimal, min: 1.0, max: 6.0, step: 0.5, unit: cm, label: Épaisseur du blindage}
  p:  {type: choice, values: [0.1, 1, 5], unit: \percent, label: Pourcentage transmis visé}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "log(2)/mu", unit: cm, label: Épaisseur de demi-atténuation}
    b: {expr: "exp(-mu*x)", unit: "", label: Fraction transmise}
    c: {expr: "log(100/p)/mu", unit: cm, label: Épaisseur requise}
