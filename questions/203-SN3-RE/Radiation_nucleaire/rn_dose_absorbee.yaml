title: Dose absorbée et dose équivalente
type: developpement
points: 20
time_min: 12
difficulty: 2
figures: []
variables:
  m:  {type: integer, min: 50, max: 100, step: 1, unit: kg, label: Masse de la personne}
  E:  {type: integer, min: 10, max: 300, step: 10, unit: mJ, si: 0.001, label: Énergie absorbée}
  Q:  {type: choice, values: [1, 10, 20], label: Facteur de pondération}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "E/m", unit: Gy, label: Dose absorbée}
    b: {expr: "Q*E/m", unit: Sv, label: Dose équivalente}
