title: Vitesse d'une particule alpha et recul du noyau
type: developpement
points: 20
time_min: 18
difficulty: 4
figures: []
variables:
  K:  {type: decimal, min: 4.0, max: 8.0, step: 0.1, unit: MeV, si: 1.602e-13, label: Énergie cinétique de la particule alpha}
  A:  {type: integer, min: 210, max: 240, step: 1, label: Nombre de masse du noyau père}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "sqrt(2*K/6.645e-27)", unit: m/s, label: Vitesse de la particule alpha}
    b: {expr: "K*4/(A - 4)/1.602e-13", unit: MeV, label: Énergie de recul}
    c: {expr: "K*A/(A - 4)/1.602e-13", unit: MeV, label: Énergie libérée Q}
