answer: C
explanation: 'Les rayons gamma sont des photons sans charge électrique : un champ magnétique ne les dévie pas. Les alphas ($+$) et les bêtas ($-$) sont déviés en sens opposés.'
choices:
  - 'Alpha'
  - 'Bêta moins'
  - 'Gamma'
  - 'Ils sont tous déviés'
