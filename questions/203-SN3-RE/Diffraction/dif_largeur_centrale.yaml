title: Largeur du maximum central de diffraction
type: developpement
points: 20
time_min: 15
difficulty: 2
figures: []
variables:
  lam: {type: integer, min: 400, max: 700, step: 10, unit: nm, si: 1e-9, label: Longueur d'onde}
  larg: {type: integer, min: 20, max: 200, step: 5, unit: \micro\metre, si: 1e-6, label: Largeur de la fente}
  L: {type: decimal, min: 1.0, max: 3.0, step: 0.1, unit: m, label: Distance fente-écran}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "deg(asin(lam/larg))", unit: deg, label: Angle du premier minimum}
    b: {expr: "2*L*tan(asin(lam/larg))", unit: m, label: Largeur du maximum central}
    c: {expr: "lam*L/larg", unit: m, label: Largeur d'un maximum secondaire}
