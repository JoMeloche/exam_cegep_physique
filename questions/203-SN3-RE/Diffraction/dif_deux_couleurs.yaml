title: Minimums de diffraction de deux couleurs qui coïncident
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  lam1: {type: integer, min: 400, max: 700, step: 10, unit: nm, si: 1e-9, label: Longueur d'onde connue}
  m1: {type: integer, min: 2, max: 5, label: Ordre du minimum de la couleur connue}
  m2: {type: integer, min: 2, max: 5, label: Ordre du minimum de l'autre couleur}
  larg: {type: integer, min: 10, max: 40, step: 1, unit: \micro\metre, si: 1e-6, label: Largeur de la fente}
  L: {type: decimal, min: 0.5, max: 2.0, step: 0.1, unit: m, label: Distance fente-écran}
constraints:
  - m1 != m2
  - 400e-9 <= m1*lam1/m2 <= 700e-9
  - m1*lam1/larg < 0.6
solution:
  mode: manual
  parts:
    lam2: {expr: "m1*lam1/m2", unit: m, label: Longueur d'onde inconnue}
    th: {expr: "deg(asin(m1*lam1/larg))", unit: deg, label: Angle de la coïncidence}
    yc: {expr: "L*tan(asin(m1*lam1/larg))", unit: m, label: Position sur l'écran}
