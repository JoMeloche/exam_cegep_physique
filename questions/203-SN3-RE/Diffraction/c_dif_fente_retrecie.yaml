answer: A
explanation: 'Le premier minimum est à $\sin\theta_1 = \lambda/a$ : si $a$ diminue, $\theta_1$ augmente et le maximum central s''élargit.'
choices:
  - 'Il devient environ deux fois plus large'
  - 'Il devient environ deux fois plus étroit'
  - 'Sa largeur ne change pas, seule son intensité diminue'
  - 'Il se sépare en deux maximums'
