title: Accorder un tuyau fermé sur une corde
type: developpement
points: 20
time_min: 18
difficulty: 4
figures: []
variables:
  L:  {type: integer, min: 50, max: 90, step: 1, unit: cm, si: 0.01, label: Longueur de la corde}
  mu: {type: decimal, min: 1.0, max: 8.0, step: 0.5, unit: g/m, si: 0.001, label: Masse linéique}
  F:  {type: integer, min: 50, max: 250, step: 10, unit: N, label: Tension}
  v:  {type: choice, values: [340, 343], unit: m/s, label: Vitesse du son}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "sqrt(F/mu)/(2*L)", unit: Hz, label: Fondamentale de la corde}
    b: {expr: "v/(4*sqrt(F/mu)/(2*L))", unit: m, label: Longueur du tuyau fermé}
    c: {expr: "3*v/(4*sqrt(F/mu)/(2*L))", unit: m, label: Longueur si le 3e harmonique coïncide}
