title: Intensité et niveau sonore d'une source ponctuelle
type: developpement
points: 20
time_min: 15
difficulty: 2
figures: []
variables:
  P:  {type: decimal, min: 0.05, max: 5.00, step: 0.05, unit: W, label: Puissance acoustique}
  r:  {type: decimal, min: 2.0, max: 30.0, step: 0.5, unit: m, label: Distance}
  b2: {type: integer, min: 40, max: 70, step: 5, unit: dB, label: Niveau sonore visé}
constraints:
  - 10*log10(P/(4*pi*r**2)/1e-12) > b2 + 5
solution:
  mode: manual
  parts:
    a: {expr: "P/(4*pi*r**2)", unit: W/m^2, label: Intensité}
    b: {expr: "10*log10(P/(4*pi*r**2)/1e-12)", unit: dB, label: Niveau sonore}
    c: {expr: "sqrt(P/(4*pi*1e-12*10**(b2/10)))", unit: m, label: Distance pour le niveau visé}
