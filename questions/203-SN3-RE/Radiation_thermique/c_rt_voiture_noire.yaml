solution: {mode: none}
answer: A
explanation: 'Une surface sombre absorbe une plus grande fraction du rayonnement solaire visible : elle reçoit plus de puissance et atteint une température plus élevée.'
choices:
  - 'La noire, car elle absorbe davantage le rayonnement solaire'
  - 'La blanche, car elle réfléchit la chaleur vers l''intérieur'
  - 'La noire, car elle émet moins de rayonnement infrarouge'
  - 'Aucune : elles reçoivent la même puissance solaire'
