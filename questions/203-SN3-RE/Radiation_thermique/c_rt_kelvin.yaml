answer: B
explanation: 'La loi de Stefan-Boltzmann utilise la température absolue : $(373/298)^4 \approx 2{,}5$. Passer de \qty{25}{\degreeCelsius} à \qty{100}{\degreeCelsius} ne multiplie pas la puissance par $4^4 = 256$.'
choices:
  - 'Environ 256'
  - 'Environ 2,5'
  - 'Exactement 4'
  - 'Environ 1,25'
