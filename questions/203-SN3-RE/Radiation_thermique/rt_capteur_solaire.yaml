title: Température d'équilibre d'un capteur solaire
type: developpement
points: 20
time_min: 18
difficulty: 4
figures: []
variables:
  I:  {type: integer, min: 600, max: 1000, step: 50, unit: W/m^2, label: Intensité solaire}
  S:  {type: decimal, min: 1.0, max: 4.0, step: 0.5, unit: m^2, label: Aire du capteur}
  ab: {type: decimal, min: 0.85, max: 0.97, step: 0.01, label: Absorptivité}
  em: {type: decimal, min: 0.10, max: 0.90, step: 0.05, label: Émissivité dans l'infrarouge}
  Te: {type: integer, min: 10, max: 30, step: 1, unit: \degreeCelsius, label: Température ambiante}
constraints: []
solution:
  mode: manual
  parts:
    e1: {expr: "ab*I*S", unit: W, label: Puissance absorbée}
    e2: {expr: "(ab*I/(em*5.67e-8) + (Te+273)**4)**0.25", unit: K, label: Température d'équilibre}
