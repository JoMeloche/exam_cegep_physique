title: Température d'un satellite sphérique dans l'espace
type: developpement
points: 20
time_min: 15
difficulty: 4
figures: []
variables:
  ab: {type: decimal, min: 0.20, max: 0.95, step: 0.05, label: Absorptivité dans le visible}
  em: {type: decimal, min: 0.10, max: 0.90, step: 0.05, label: Émissivité dans l'infrarouge}
constraints:
  - 200 < (ab*1361/(4*em*5.67e-8))**0.25 < 420
solution:
  mode: manual
  parts:
    e1: {expr: "(ab*1361/(4*em*5.67e-8))**0.25", unit: K, label: Température d'équilibre}
    e2: {expr: "(1361/(4*5.67e-8))**0.25", unit: K, label: Température d'un corps noir}
