answer: D
explanation: '$\sin\theta = m\lambda/d$ : la déviation augmente avec la longueur d''onde. Le rouge est donc plus dévié que le violet, contrairement à un prisme.'
choices:
  - 'Le violet'
  - 'Le vert'
  - 'Toutes les couleurs sont déviées du même angle'
  - 'Le rouge'
