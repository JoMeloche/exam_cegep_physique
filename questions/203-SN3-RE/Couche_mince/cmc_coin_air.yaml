title: Franges d'un coin d'air entre deux plaques de verre
type: developpement
points: 20
time_min: 18
difficulty: 4
figures: []
variables:
  lam: {type: integer, min: 450, max: 650, step: 10, unit: nm, si: 1e-9, label: Longueur d'onde}
  hc: {type: integer, min: 20, max: 100, step: 2, unit: \micro\metre, si: 1e-6, label: Diamètre du cheveu}
  Lp: {type: decimal, min: 5.0, max: 15.0, step: 0.5, unit: cm, si: 0.01, label: Longueur des plaques}
constraints:
  - abs(2*hc/lam - round(2*hc/lam)) > 0.15
solution:
  mode: manual
  parts:
    th: {expr: "hc/Lp", unit: rad, label: Angle du coin}
    dx: {expr: "lam*Lp/(2*hc)", unit: m, label: Distance entre franges sombres}
    N: {expr: "floor(2*hc/lam) + 1", unit: "", label: Nombre de franges sombres}
