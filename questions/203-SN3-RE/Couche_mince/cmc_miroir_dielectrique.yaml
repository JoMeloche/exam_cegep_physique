title: Couche réfléchissante d'indice élevé sur du verre
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  lam: {type: integer, min: 450, max: 650, step: 10, unit: nm, si: 1e-9, label: Longueur d'onde à réfléchir}
  nc: {type: choice, values: [2.30, 2.40], label: Indice de réfraction de la couche}
constraints: []
solution:
  mode: manual
  parts:
    t1: {expr: "lam/(4*nc)", unit: m, label: Épaisseur minimale}
    t2: {expr: "3*lam/(4*nc)", unit: m, label: Épaisseur suivante}
    lx: {expr: "lam/2", unit: m, label: Longueur d'onde éteinte}
