title: Voyage vers une étoile proche
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  D: {type: decimal, min: 4.0, max: 25.0, step: 0.1, unit: al, label: Distance (années-lumière)}
  beta: {type: decimal, min: 0.60, max: 0.99, step: 0.01, label: Vitesse en fraction de c}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "D/beta", unit: an, label: Durée selon la Terre}
    b: {expr: "D/beta*sqrt(1 - beta**2)", unit: an, label: Durée selon l'équipage}
    c: {expr: "D*sqrt(1 - beta**2)", unit: al, label: Distance selon l'équipage}
