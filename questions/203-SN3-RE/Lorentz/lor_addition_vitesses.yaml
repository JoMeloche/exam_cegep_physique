title: Addition relativiste des vitesses
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  u1: {type: decimal, min: 0.40, max: 0.90, step: 0.05, label: Vitesse du vaisseau (fraction de c)}
  u2: {type: decimal, min: 0.30, max: 0.90, step: 0.05, label: Vitesse de la sonde par rapport au vaisseau}
constraints:
  - abs(u1 - u2) >= 0.1
solution:
  mode: manual
  parts:
    a: {expr: "(u1 + u2)/(1 + u1*u2)", unit: c, label: Vitesse de la sonde (Terre)}
    b: {expr: "(u2 - u1)/(1 - u1*u2)", unit: c, label: Vitesse de la sonde lancée vers l'arrière}
    c: {expr: "2*u1/(1 + u1**2)", unit: c, label: Vitesse relative de deux vaisseaux}
