title: Contraction des longueurs d'un vaisseau qui passe devant une station
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  L0: {type: integer, min: 50, max: 500, step: 10, unit: m, label: Longueur propre du vaisseau}
  beta: {type: decimal, min: 0.50, max: 0.98, step: 0.01, label: Vitesse en fraction de c}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "1/sqrt(1 - beta**2)", unit: "", label: Facteur gamma}
    b: {expr: "L0*sqrt(1 - beta**2)", unit: m, label: Longueur mesurée par la station}
    c: {expr: "L0*sqrt(1 - beta**2)/(beta*3e8)", unit: s, label: Durée du passage (station)}
