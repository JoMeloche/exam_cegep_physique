title: Muons atmosphériques et dilatation du temps
type: developpement
points: 20
time_min: 18
difficulty: 3
figures: []
variables:
  beta: {type: choice, values: [0.990, 0.992, 0.994, 0.995, 0.996, 0.998], label: Vitesse en fraction de c}
  h: {type: decimal, min: 5.0, max: 15.0, step: 0.5, unit: km, si: 1000, label: Altitude de production}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "h/(beta*3e8)", unit: s, label: Temps de trajet (Terre)}
    b: {expr: "h/(beta*3e8)*sqrt(1 - beta**2)", unit: s, label: Temps propre}
    c: {expr: "exp(-h/(beta*3e8)*sqrt(1 - beta**2)/2.2e-6)", unit: "", label: Fraction de survivants}
