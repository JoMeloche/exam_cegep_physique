title: Intensité en un point d'une figure de Young
type: developpement
points: 20
time_min: 18
difficulty: 4
figures: []
variables:
  lam: {type: integer, min: 450, max: 680, step: 10, unit: nm, si: 1e-9, label: Longueur d'onde}
  sep: {type: decimal, min: 0.20, max: 0.80, step: 0.05, unit: mm, si: 0.001, label: Distance entre les fentes}
  L: {type: decimal, min: 1.0, max: 2.5, step: 0.1, unit: m, label: Distance fentes-écran}
  y: {type: decimal, min: 0.5, max: 6.0, step: 0.1, unit: mm, si: 0.001, label: Position du point sur l'écran}
  Imax: {type: decimal, min: 2.0, max: 9.0, step: 0.5, unit: W/m^2, label: Intensité au centre}
constraints:
  - 0.1 < cos(pi*sep*y/(lam*L))**2 < 0.9
solution:
  mode: manual
  parts:
    a: {expr: "sep*y/L", unit: m, label: Différence de marche}
    b: {expr: "2*pi*sep*y/(lam*L)", unit: rad, label: Déphasage}
    c: {expr: "Imax*cos(pi*sep*y/(lam*L))**2", unit: W/m^2, label: Intensité au point P}
