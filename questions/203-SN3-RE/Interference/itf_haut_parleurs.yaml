title: Interférence de deux haut-parleurs
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  r1: {type: decimal, min: 3.0, max: 6.0, step: 0.1, unit: m, label: Distance au haut-parleur 1}
  r2: {type: decimal, min: 3.5, max: 8.0, step: 0.1, unit: m, label: Distance au haut-parleur 2}
  v: {type: choice, values: [340, 343], unit: m/s, label: Vitesse du son}
constraints:
  - 0.4 <= r2 - r1 <= 2.0
solution:
  mode: manual
  parts:
    dr: {expr: "r2 - r1", unit: m, label: Différence de marche}
    f1: {expr: "v/(2*(r2 - r1))", unit: Hz, label: Plus basse fréquence destructive}
    f2: {expr: "v/(r2 - r1)", unit: Hz, label: Plus basse fréquence constructive}
    f3: {expr: "v/(2*(r2 - r1))", unit: Hz, label: Plus basse fréquence constructive (déphasés)}
