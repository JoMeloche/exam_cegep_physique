title: Battements entre deux flûtes à des températures différentes
type: developpement
points: 20
time_min: 15
difficulty: 4
figures: []
variables:
  f:  {type: choice, values: [440, 523.3, 587.3, 659.3], unit: Hz, label: Fréquence à 20 °C}
  T2: {type: integer, min: 24, max: 35, step: 1, unit: \degreeCelsius, label: Température de la flûte chaude}
constraints: []
solution:
  mode: manual
  parts:
    a: {expr: "f*sqrt((T2+273)/293)", unit: Hz, label: Fréquence de la flûte chaude}
    b: {expr: "f*sqrt((T2+273)/293) - f", unit: Hz, label: Fréquence des battements}
