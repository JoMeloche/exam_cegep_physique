title: Battements entendus en marchant entre deux haut-parleurs
type: developpement
points: 20
time_min: 15
difficulty: 4
figures: []
variables:
  f:  {type: integer, min: 200, max: 1000, step: 20, unit: Hz, label: Fréquence des haut-parleurs}
  vo: {type: decimal, min: 0.8, max: 3.0, step: 0.1, unit: m/s, label: Vitesse de la marcheuse}
  v:  {type: choice, values: [340, 343], unit: m/s, label: Vitesse du son}
constraints: []
solution:
  mode: manual
  parts:
    a1: {expr: "f*(v + vo)/v", unit: Hz, label: Fréquence du haut-parleur avant}
    a2: {expr: "f*(v - vo)/v", unit: Hz, label: Fréquence du haut-parleur arrière}
    b: {expr: "2*f*vo/v", unit: Hz, label: Fréquence des battements}
