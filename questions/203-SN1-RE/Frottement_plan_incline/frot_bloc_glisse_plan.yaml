title: Bloc qui glisse sur un plan incliné
type: developpement
points: 20
time_min: 13
difficulty: 2
figures: []
variables:
  th: {type: integer, unit: \degree, label: Angle du plan incliné, min: 25, max: 45, step: 1}
  mu: {type: decimal, step: 0.01, label: Coefficient de frottement cinétique, min: 0.1, max: 0.35}
  L: {type: decimal, min: 1.0, max: 5.0, step: 0.1, unit: m, label: Longueur du plan}
constraints: [sin(rad(th)) - mu*cos(rad(th)) > 0.1]
solution:
  mode: manual
  file: frot_bloc_glisse_plan.sol.tex
  parts:
    a: {expr: g*(sin(rad(th)) - mu*cos(rad(th))), unit: m/s^2, label: Accélération}
    b: {expr: sqrt(2*g*(sin(rad(th)) - mu*cos(rad(th)))*L), unit: m/s, label: Vitesse au bas du plan}
    c: {expr: sqrt(2*L/(g*(sin(rad(th)) - mu*cos(rad(th))))), unit: s, label: Durée de la descente}
