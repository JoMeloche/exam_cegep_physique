title: 'Livre pressé contre un mur'
type: developpement
points: 20
time_min: 12
difficulty: 2
figures: []
variables:
  m: {type: decimal, min: 0.5, max: 2.0, step: 0.1, unit: kg, label: Masse du livre}
  mus: {type: decimal, min: 0.30, max: 0.70, step: 0.05, label: Coefficient de frottement statique}
  F: {type: integer, min: 20, max: 80, step: 5, unit: N, label: Force horizontale appliquée}
constraints:
  - 'mus*F > 1.1*m*g'
solution:
  mode: manual
  file: frot_livre_contre_mur.sol.tex
  parts:
    a: {expr: 'm*9.81', unit: 'N', label: 'Force de frottement'}
    b: {expr: 'mus*F', unit: 'N', label: 'Frottement statique maximal'}
    c: {expr: 'm*9.81/mus', unit: 'N', label: 'Poussée minimale'}
