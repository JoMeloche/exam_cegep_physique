title: Bloc lancé vers le haut d'un plan rugueux
type: developpement
points: 20
time_min: 17
difficulty: 4
figures: []
variables:
  th: {type: integer, unit: \degree, label: Angle du plan incliné, min: 25, max: 40, step: 1}
  mu: {type: decimal, step: 0.01, label: Coefficient de frottement cinétique, min: 0.1, max: 0.3}
  v0: {type: decimal, min: 3.0, max: 8.0, step: 0.5, unit: m/s, label: Vitesse initiale}
constraints: [sin(rad(th)) - mu*cos(rad(th)) > 0.15]
solution:
  mode: manual
  file: frot_bloc_lance_haut_plan.sol.tex
  parts:
    a: {expr: g*(sin(rad(th)) + mu*cos(rad(th))), unit: m/s^2, label: Accélération à la montée}
    b: {expr: v0**2/(2*g*(sin(rad(th)) + mu*cos(rad(th)))), unit: m, label: Distance parcourue}
    c: {expr: g*(sin(rad(th)) - mu*cos(rad(th))), unit: m/s^2, label: Accélération à la descente}
    d: {expr: sqrt(2*g*(sin(rad(th)) - mu*cos(rad(th)))*v0**2/(2*g*(sin(rad(th)) + mu*cos(rad(th))))), unit: m/s, label: Vitesse au retour}
