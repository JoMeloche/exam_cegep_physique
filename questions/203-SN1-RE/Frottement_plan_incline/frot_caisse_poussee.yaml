title: Caisse poussée sur le plancher
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  m: {type: integer, min: 20, max: 80, step: 1, unit: kg, label: Masse de la caisse}
  mus: {type: decimal, min: 0.4, max: 0.7, step: 0.01, label: Coefficient de frottement statique}
  mu: {type: decimal, step: 0.01, label: Coefficient de frottement cinétique, min: 0.2, max: 0.45}
  F: {type: integer, min: 150, max: 600, step: 10, unit: N, label: Force appliquée}
  t: {type: decimal, min: 1.0, max: 4.0, step: 0.5, unit: s, label: Durée de la poussée}
constraints: [mu < mus - 0.1, F > 1.15*mus*m*g, F < 3*mus*m*g]
solution:
  mode: manual
  file: frot_caisse_poussee.sol.tex
  parts:
    a: {expr: mus*m*g, unit: N, label: Force minimale}
    b: {expr: (F - mu*m*g)/m, unit: m/s^2, label: Accélération}
    c: {expr: (((F - mu*m*g)/m)*t)**2/(2*mu*g), unit: m, label: Distance de glissement après la poussée}
