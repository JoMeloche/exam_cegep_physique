title: 'Enseigne suspendue au bout d''une tige retenue par un câble'
type: developpement
points: 20
time_min: 20
difficulty: 4
figures: []
variables:
  L: {type: decimal, min: 1.0, max: 3.0, step: 0.1, unit: m, label: Longueur de la tige}
  M: {type: decimal, min: 2.0, max: 15.0, step: 0.5, unit: kg, label: Masse de la tige}
  m: {type: decimal, min: 5.0, max: 30.0, step: 0.5, unit: kg, label: Masse de l'enseigne}
  th: {type: integer, min: 25, max: 60, step: 1, unit: '\degree', label: Angle du câble avec la tige}
constraints: []
solution:
  mode: manual
  file: eq_enseigne_cable.sol.tex
  parts:
    a: {expr: "(M/2 + m)*g/sin(rad(th))", unit: 'N', label: 'Tension du câble'}
    b: {expr: "((M/2 + m)*g/sin(rad(th)))*cos(rad(th))", unit: 'N', label: 'Force horizontale de la charnière'}
    c: {expr: "(M + m)*g - ((M/2 + m)*g/sin(rad(th)))*sin(rad(th))", unit: 'N', label: 'Force verticale de la charnière'}
