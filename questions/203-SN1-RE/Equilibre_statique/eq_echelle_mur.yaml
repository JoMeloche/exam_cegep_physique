title: 'Échelle appuyée contre un mur lisse'
type: developpement
points: 20
time_min: 20
difficulty: 4
figures: []
variables:
  L: {type: decimal, min: 3.0, max: 7.0, step: 0.5, unit: m, label: Longueur de l'échelle}
  M: {type: integer, min: 10, max: 25, step: 1, unit: kg, label: Masse de l'échelle}
  m: {type: integer, min: 50, max: 95, step: 5, unit: kg, label: Masse de la personne}
  th: {type: integer, min: 55, max: 75, step: 1, unit: '\degree', label: Angle avec le sol}
  s: {type: decimal, min: 1.0, max: 6.5, step: 0.5, unit: m, label: Distance parcourue sur l'échelle}
constraints:
  - s < 0.9*L
solution:
  mode: manual
  file: eq_echelle_mur.sol.tex
  parts:
    a: {expr: "g*(M*L/2 + m*s)/(L*tan(rad(th)))", unit: 'N', label: 'Normale du mur'}
    b1: {expr: "(M + m)*g", unit: 'N', label: 'Normale du sol'}
    b2: {expr: "(g*(M*L/2 + m*s)/(L*tan(rad(th))))", unit: 'N', label: 'Frottement du sol'}
    c: {expr: "(g*(M*L/2 + m*s)/(L*tan(rad(th))))/((M + m)*g)", unit: '', label: 'Coefficient de frottement minimal'}
