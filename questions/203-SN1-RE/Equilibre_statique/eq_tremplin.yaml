title: 'Plongeur au bout d''un tremplin'
type: developpement
points: 20
time_min: 18
difficulty: 3
figures: []
variables:
  L: {type: decimal, min: 3.0, max: 5.0, step: 0.1, unit: m, label: Longueur du tremplin}
  d: {type: decimal, min: 0.8, max: 1.8, step: 0.1, unit: m, label: Distance entre les supports}
  M: {type: integer, min: 20, max: 50, step: 1, unit: kg, label: Masse du tremplin}
  m: {type: integer, min: 45, max: 100, step: 1, unit: kg, label: Masse du plongeur}
constraints:
  - d < 0.45*L
solution:
  mode: manual
  file: eq_tremplin.sol.tex
  parts:
    a: {expr: "g*(M*L/2 + m*L)/d", unit: 'N', label: 'Force de l''appui'}
    b: {expr: "(g*(M*L/2 + m*L)/d) - (M + m)*g", unit: 'N', label: 'Force du boulon (vers le bas)'}
