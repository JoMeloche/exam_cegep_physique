title: 'Caisse tirée par une corde inclinée avec frottement'
type: developpement
points: 20
time_min: 18
difficulty: 4
figures: []
variables:
  m: {type: integer, min: 10, max: 40, step: 1, unit: kg, label: Masse de la caisse}
  F: {type: integer, min: 60, max: 200, step: 5, unit: N, label: Force de traction}
  th: {type: integer, min: 15, max: 40, step: 1, unit: '\degree', label: Angle de la corde}
  mu: {type: decimal, min: 0.10, max: 0.40, step: 0.05, label: Coefficient de frottement cinétique}
  d: {type: decimal, min: 2.0, max: 10.0, step: 0.5, unit: m, label: Déplacement}
constraints:
  - F*cos(rad(th)) > 1.3*mu*(m*g - F*sin(rad(th)))
  - F*sin(rad(th)) < 0.8*m*g
solution:
  mode: manual
  file: te_caisse_tiree_angle.sol.tex
  parts:
    a: {expr: "F*d*cos(rad(th))", unit: 'J', label: 'Travail de la corde'}
    b: {expr: "-mu*(m*g - F*sin(rad(th)))*d", unit: 'J', label: 'Travail du frottement'}
    c: {expr: "sqrt(2*((F*d*cos(rad(th))) + (-mu*(m*g - F*sin(rad(th)))*d))/m)", unit: 'm/s', label: 'Vitesse finale'}
