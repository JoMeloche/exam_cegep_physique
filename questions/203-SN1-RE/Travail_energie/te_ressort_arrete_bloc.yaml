title: 'Ressort qui arrête un bloc'
type: developpement
points: 20
time_min: 14
difficulty: 2
figures: []
variables:
  m: {type: decimal, min: 1.0, max: 5.0, step: 0.5, unit: kg, label: Masse du bloc}
  v: {type: decimal, min: 1.0, max: 4.0, step: 0.25, unit: m/s, label: Vitesse du bloc}
  k: {type: integer, min: 200, max: 1000, step: 50, unit: N/m, label: Constante du ressort}
constraints: []
solution:
  mode: manual
  file: te_ressort_arrete_bloc.sol.tex
  parts:
    a: {expr: 'v*sqrt(m/k)', unit: 'm', label: 'Compression maximale'}
    b: {expr: 'k*v*sqrt(m/k)', unit: 'N', label: 'Force maximale du ressort'}
    c: {expr: 'v*sqrt(3)/2', unit: 'm/s', label: 'Vitesse à mi-compression'}
