title: 'Wagon dans une boucle verticale'
type: developpement
points: 20
time_min: 18
difficulty: 4
figures: []
variables:
  m: {type: integer, min: 300, max: 800, step: 50, unit: kg, label: Masse du wagon}
  R: {type: decimal, min: 5.0, max: 15.0, step: 0.5, unit: m, label: Rayon de la boucle}
  h: {type: decimal, min: 20.0, max: 50.0, step: 0.5, unit: m, label: Hauteur de départ}
constraints:
  - h > 2.7*R
  - h < 4*R
solution:
  mode: manual
  file: te_boucle_montagnes_russes.sol.tex
  parts:
    a: {expr: "sqrt(2*g*(h - 2*R))", unit: 'm/s', label: 'Vitesse au sommet'}
    b: {expr: "m*(2*g*(h - 2*R)/R - g)", unit: 'N', label: 'Normale au sommet'}
    c: {expr: "2.5*R", unit: 'm', label: 'Hauteur minimale'}
