title: 'Bloc sur une rampe puis sur une surface rugueuse'
type: developpement
points: 20
time_min: 15
difficulty: 2
figures: []
variables:
  m: {type: decimal, min: 1.0, max: 5.0, step: 0.5, unit: kg, label: Masse du bloc}
  h: {type: decimal, min: 0.5, max: 3.0, step: 0.1, unit: m, label: Hauteur de départ}
  mu: {type: decimal, min: 0.15, max: 0.60, step: 0.05, label: Coefficient de frottement cinétique}
constraints: []
solution:
  mode: manual
  file: te_bloc_rampe_frottement.sol.tex
  parts:
    a: {expr: "sqrt(2*g*h)", unit: 'm/s', label: 'Vitesse au bas de la rampe'}
    b: {expr: "h/mu", unit: 'm', label: 'Distance de freinage'}
    c: {expr: "-m*g*h", unit: 'J', label: 'Travail du frottement'}
