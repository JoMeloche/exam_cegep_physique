title: Décollage d'une petite fusée
type: developpement
points: 20
time_min: 16
difficulty: 3
figures: []
variables:
  M: {type: integer, min: 400, max: 1500, step: 50, unit: kg, label: Masse de la fusée}
  F: {type: decimal, min: 8.0, max: 30.0, step: 0.5, unit: kN, si: 1000, label: Poussée des moteurs}
  t: {type: integer, min: 5, max: 20, unit: s, label: Durée de la poussée}
constraints: [F > 1.3*M*g, F < 3*M*g]
solution:
  mode: manual
  file: newt_fusee_decollage.sol.tex
  parts:
    a: {expr: F/M - g, unit: m/s^2, label: Accélération pendant la poussée}
    b1: {expr: (F/M - g)*t**2/2, unit: m, label: Altitude à l'arrêt des moteurs}
    b2: {expr: (F/M - g)*t, unit: m/s, label: Vitesse à l'arrêt des moteurs}
    c: {expr: (F/M - g)*t**2/2 + ((F/M - g)*t)**2/(2*g), unit: m, label: Altitude maximale}
