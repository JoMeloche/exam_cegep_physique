title: Machine d'Atwood
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  m1: {type: decimal, min: 2.0, max: 6.0, step: 0.5, unit: kg, label: Masse 1}
  m2: {type: decimal, min: 1.0, max: 5.0, step: 0.5, unit: kg, label: Masse 2}
  d: {type: decimal, min: 0.5, max: 2.0, step: 0.1, unit: m, label: Distance de descente}
constraints: [m1 - m2 >= 0.5]
solution:
  mode: manual
  file: newt_machine_atwood.sol.tex
  parts:
    a: {expr: (m1 - m2)*g/(m1 + m2), unit: m/s^2, label: Accélération}
    b: {expr: 2*m1*m2*g/(m1 + m2), unit: N, label: Tension}
    c: {expr: sqrt(2*(m1 - m2)*g/(m1 + m2)*d), unit: m/s, label: Vitesse}
