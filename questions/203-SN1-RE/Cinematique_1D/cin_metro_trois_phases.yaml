title: Métro entre deux stations
type: developpement
points: 20
time_min: 16
difficulty: 3
figures: []
variables:
  a1: {type: decimal, min: 0.8, max: 1.6, step: 0.1, unit: m/s^2, label: Accélération au départ}
  t1: {type: integer, min: 10, max: 20, unit: s, label: Durée de l'accélération}
  t2: {type: integer, min: 30, max: 90, step: 5, unit: s, label: Durée à vitesse constante}
  a3: {type: decimal, min: 1.0, max: 2.0, step: 0.1, unit: m/s^2, label: Décélération à l'arrivée}
constraints: [a1*t1 < 22]
solution:
  mode: manual
  file: cin_metro_trois_phases.sol.tex
  parts:
    a: {expr: a1*t1, unit: m/s, label: Vitesse maximale}
    b: {expr: a1*t1**2/2 + a1*t1*t2 + (a1*t1)**2/(2*a3), unit: m, label: Distance entre les stations}
    c: {expr: (a1*t1**2/2 + a1*t1*t2 + (a1*t1)**2/(2*a3))/(t1 + t2 + a1*t1/a3), unit: m/s, label: Vitesse moyenne}
