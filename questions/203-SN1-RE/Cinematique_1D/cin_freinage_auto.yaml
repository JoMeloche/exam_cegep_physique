title: Distance d'arrêt d'une automobile
type: developpement
points: 20
time_min: 12
difficulty: 2
figures: []
variables:
  v0: {type: integer, min: 50, max: 110, step: 5, unit: km/h, si: 0.2777777778, label: Vitesse initiale}
  tr: {type: decimal, min: 0.6, max: 1.5, step: 0.1, unit: s, label: Temps de réaction}
  a: {type: decimal, min: 4.0, max: 8.0, step: 0.5, unit: m/s^2, label: Décélération au freinage}
constraints: []
solution:
  mode: manual
  file: cin_freinage_auto.sol.tex
  parts:
    a: {expr: v0*tr, unit: m, label: Distance pendant la réaction}
    b: {expr: v0**2/(2*a), unit: m, label: Distance de freinage}
    c: {expr: tr + v0/a, unit: s, label: Temps total d'arrêt}
