title: Balle lancée vers un mur
type: developpement
points: 20
time_min: 15
difficulty: 3
figures: []
variables:
  v0: {type: decimal, min: 14.0, max: 22.0, step: 0.5, unit: m/s, label: Vitesse initiale}
  th: {type: integer, unit: \degree, label: Angle de lancement, min: 30, max: 55, step: 5}
  y0: {type: decimal, min: 1.5, max: 2.0, step: 0.1, unit: m, label: Hauteur de lancer}
  D: {type: decimal, min: 10.0, max: 25.0, step: 0.5, unit: m, label: Distance du mur}
constraints: [y0 + v0*sin(rad(th))*D/(v0*cos(rad(th))) - g*(D/(v0*cos(rad(th))))**2/2 > 0.5, abs(v0*sin(rad(th)) - g*D/(v0*cos(rad(th)))) > 0.5]
solution:
  mode: manual
  file: proj_balle_mur.sol.tex
  parts:
    a: {expr: D/(v0*cos(rad(th))), unit: s, label: Temps pour atteindre le mur}
    b: {expr: y0 + v0*sin(rad(th))*D/(v0*cos(rad(th))) - g*(D/(v0*cos(rad(th))))**2/2, unit: m, label: Hauteur d'impact}
    c: {expr: v0*sin(rad(th)) - g*D/(v0*cos(rad(th))), unit: m/s, label: Vitesse verticale (positive vers le haut)}
