title: Coup de pied au ballon
type: developpement
points: 20
time_min: 13
difficulty: 2
figures: []
variables:
  v0: {type: decimal, min: 12.0, max: 28.0, step: 0.5, unit: m/s, label: Vitesse initiale}
  th: {type: integer, unit: \degree, label: Angle de lancement, min: 20, max: 65, step: 5}
constraints: []
solution:
  mode: manual
  file: proj_ballon_soccer.sol.tex
