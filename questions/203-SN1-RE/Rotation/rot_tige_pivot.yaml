title: 'Tige qui pivote autour d''une extrémité'
type: developpement
points: 20
time_min: 18
difficulty: 4
figures: []
variables:
  L: {type: decimal, min: 0.5, max: 2.0, step: 0.1, unit: m, label: Longueur de la tige}
  M: {type: decimal, min: 0.5, max: 4.0, step: 0.5, unit: kg, label: Masse de la tige}
constraints: []
solution:
  mode: manual
  file: rot_tige_pivot.sol.tex
  parts:
    a: {expr: "M*g*L/2", unit: 'N*m', label: 'Moment de force initial'}
    b: {expr: "3*g/(2*L)", unit: 'rad/s^2', label: 'Accélération angulaire initiale'}
    c: {expr: "sqrt(3*g*L)", unit: 'm/s', label: 'Vitesse de l''extrémité'}
