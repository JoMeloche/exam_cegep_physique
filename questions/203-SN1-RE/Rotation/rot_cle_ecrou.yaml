title: 'Moment de force d''une clé sur un écrou rouillé'
type: developpement
points: 20
time_min: 12
difficulty: 2
figures: []
variables:
  L: {type: integer, min: 20, max: 45, step: 1, unit: cm, si: 0.01, label: Longueur de la clé}
  F: {type: integer, min: 50, max: 250, step: 5, unit: N, label: Force appliquée}
  th: {type: integer, min: 30, max: 80, step: 1, unit: '\degree', label: Angle entre la force et la clé}
  tau0: {type: integer, min: 40, max: 120, step: 5, unit: N.m, label: Moment de force nécessaire}
constraints: []
solution:
  mode: manual
  file: rot_cle_ecrou.sol.tex
  parts:
    a: {expr: "F*L*sin(rad(th))", unit: 'N*m', label: 'Moment de force appliqué'}
    b: {expr: "tau0/L", unit: 'N', label: 'Force perpendiculaire minimale'}
    c: {expr: "tau0/(L*sin(rad(th)))", unit: 'N', label: 'Force minimale à l''angle donné'}
