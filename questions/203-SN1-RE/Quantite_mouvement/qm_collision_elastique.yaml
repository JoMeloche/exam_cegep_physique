title: 'Collision élastique entre deux rondelles'
type: developpement
points: 20
time_min: 18
difficulty: 4
figures: []
variables:
  m1: {type: decimal, min: 0.10, max: 1.00, step: 0.05, unit: kg, label: Masse de la rondelle 1}
  m2: {type: decimal, min: 0.10, max: 1.00, step: 0.05, unit: kg, label: Masse de la rondelle 2}
  v1: {type: decimal, min: 1.0, max: 5.0, step: 0.1, unit: m/s, label: Vitesse initiale de la rondelle 1}
constraints:
  - abs(m1 - m2) > 0.1
solution:
  mode: manual
  file: qm_collision_elastique.sol.tex
  parts:
    a: {expr: "(m1 - m2)/(m1 + m2)*v1", unit: 'm/s', label: 'Vitesse finale de la rondelle 1'}
    b: {expr: "2*m1/(m1 + m2)*v1", unit: 'm/s', label: 'Vitesse finale de la rondelle 2'}
    c: {expr: "400*m1*m2/(m1 + m2)**2", unit: '\percent', label: 'Pourcentage transféré'}
