solution: {mode: none}
answer: A
explanation: 'Les quantités de mouvement ont le même module $p$, mais $K = p^2/(2m)$ : la balle, beaucoup plus légère, a beaucoup plus d''énergie cinétique.'
choices:
  - 'Celle de la balle est beaucoup plus grande'
  - 'Elles sont égales, comme les quantités de mouvement'
  - 'Celle du fusil est beaucoup plus grande'
  - 'Celle de la balle est nulle'
