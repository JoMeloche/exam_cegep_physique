title: 'Variation de quantité de mouvement camion-voiture'
type: conceptuel
points: 4
time_min: 4
difficulty: 2
figures: []
variables: {}
solution: {mode: none}
answer: A
explanation: 'Les forces d''interaction sont égales et opposées et agissent pendant la même durée : les impulsions, donc les variations de quantité de mouvement, ont le même module ($\Delta\vec p_{\text{camion}} = -\Delta\vec p_{\text{voiture}}$). C''est la variation de vitesse de la voiture qui est plus grande, car sa masse est plus petite.'
choices:
  - 'Elles ont le même module'
  - 'Celle de la voiture est plus grande'
  - 'Celle du camion est plus grande'
  - 'Cela dépend des vitesses des deux véhicules'
