answer: C
explanation: 'Pour A, $\Delta p = 2mv$ ; pour B, $\Delta p = mv$. La balle qui rebondit reçoit une impulsion deux fois plus grande.'
choices:
  - 'Aucune des deux ne reçoit d''impulsion'
  - 'Elles reçoivent la même impulsion'
  - 'La balle A'
  - 'La balle B'
