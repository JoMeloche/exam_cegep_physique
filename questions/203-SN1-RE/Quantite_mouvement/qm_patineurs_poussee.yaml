title: 'Deux patineurs qui se repoussent'
type: developpement
points: 20
time_min: 12
difficulty: 2
figures: []
variables:
  m1: {type: integer, min: 40, max: 90, step: 1, unit: kg, label: Masse du patineur 1}
  m2: {type: integer, min: 40, max: 90, step: 1, unit: kg, label: Masse du patineur 2}
  v1: {type: decimal, min: 0.5, max: 3.0, step: 0.1, unit: m/s, label: Vitesse du patineur 1}
  dt: {type: decimal, min: 0.2, max: 1.0, step: 0.1, unit: s, label: Durée de la poussée}
constraints: []
solution:
  mode: manual
  file: qm_patineurs_poussee.sol.tex
  parts:
    a: {expr: "m1*v1/m2", unit: 'm/s', label: 'Vitesse du patineur 2'}
    b: {expr: "0.5*m1*v1**2 + 0.5*m2*((m1*v1/m2))**2", unit: 'J', label: 'Énergie cinétique totale'}
    c: {expr: "m1*v1/dt", unit: 'N', label: 'Force moyenne'}
