title: 'Impulsion d''une balle qui rebondit sur un mur'
type: developpement
points: 20
time_min: 12
difficulty: 3
figures: []
variables:
  m: {type: integer, min: 50, max: 500, step: 10, unit: g, si: 0.001, label: Masse de la balle}
  v1: {type: decimal, min: 10.0, max: 40.0, step: 0.5, unit: m/s, label: Vitesse avant le choc}
  v2: {type: decimal, min: 5.0, max: 30.0, step: 0.5, unit: m/s, label: Vitesse après le choc}
  dt: {type: decimal, min: 2.0, max: 20.0, step: 0.5, unit: ms, si: 0.001, label: Durée du contact}
constraints:
  - v2 < 0.9*v1
solution:
  mode: manual
  file: qm_balle_mur_impulsion.sol.tex
  parts:
    a: {expr: "m*(v1 + v2)", unit: 'kg*m/s', label: 'Impulsion'}
    b: {expr: "m*(v1 + v2)/dt", unit: 'N', label: 'Force moyenne'}
    c: {expr: "0.5*m*(v1**2 - v2**2)", unit: 'J', label: 'Énergie cinétique perdue'}
