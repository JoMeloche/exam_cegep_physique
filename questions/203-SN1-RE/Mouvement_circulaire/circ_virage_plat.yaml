title: Voiture dans un virage plat
type: developpement
points: 20
time_min: 13
difficulty: 2
figures: []
variables:
  m: {type: integer, min: 900, max: 1800, step: 50, unit: kg, label: Masse de la voiture}
  r: {type: integer, min: 40, max: 150, step: 5, unit: m, label: Rayon du virage}
  mus: {type: decimal, min: 0.4, max: 0.9, step: 0.01, label: Coefficient de frottement statique}
  vk: {type: integer, min: 40, max: 90, step: 5, unit: km/h, si: 0.2777777778, label: Vitesse de la voiture}
constraints: [vk < 0.9*sqrt(mus*g*r)]
solution:
  mode: manual
  file: circ_virage_plat.sol.tex
  parts:
    a: {expr: sqrt(mus*g*r), unit: m/s, label: Vitesse maximale}
    b: {expr: vk**2/r, unit: m/s^2, label: Accélération centripète}
    c: {expr: m*vk**2/r, unit: N, label: Force de frottement}
