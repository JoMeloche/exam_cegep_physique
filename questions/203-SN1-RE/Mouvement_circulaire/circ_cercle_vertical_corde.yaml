title: Pierre en cercle vertical au bout d'une corde
type: developpement
points: 20
time_min: 14
difficulty: 3
figures: []
variables:
  m: {type: decimal, min: 0.2, max: 1.5, step: 0.1, unit: kg, label: Masse de la pierre}
  L: {type: decimal, min: 0.5, max: 1.2, step: 0.05, unit: m, label: Longueur de la corde}
  vt: {type: decimal, min: 3.0, max: 6.0, step: 0.1, unit: m/s, label: Vitesse au sommet}
  vb: {type: decimal, min: 5.0, max: 9.0, step: 0.1, unit: m/s, label: Vitesse au bas}
constraints: [vt**2 > 1.3*g*L, vb > vt + 1]
solution:
  mode: manual
  file: circ_cercle_vertical_corde.sol.tex
  parts:
    a: {expr: sqrt(g*L), unit: m/s, label: Vitesse minimale au sommet}
    b: {expr: m*(vt**2/L - g), unit: N, label: Tension au sommet}
    c: {expr: m*(vb**2/L + g), unit: N, label: Tension au bas}
